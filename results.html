const recTxt=x=>`${x.w}/${x.n} won · <span class=${x.p>=0?"pos":"neg"}>${x.p>=0?"+":""}${x.p.toFixed(2)}u</span>${x.st?` · ROI ${(x.p/x.st*100>=0?"+":"")}${(x.p/x.st*100).toFixed(0)}%`:""}${x.open?` · ${x.open} pending`:""}`;
function draw(){const base=EV.filter(inPer);
 let h=`<div class=fpills><label class=fpill><select id=evp>${[["all","All time"],["month","This month"],["week","Last 7 days"],["yday","Yesterday"]].map(([v,l])=>`<option value=${v}${v===F.per?" selected":""}>${l}</option>`).join("")}</select></label></div>`;
 TY.forEach((t,ti)=>{const rs=base.filter(r=>r.t===t);if(!rs.length)return;const x=rec(rs);
  const all=[...new Set(rs.map(r=>day(r.d)))],past=all.filter(d=>d<=today).sort().reverse(),fut=all.filter(d=>d>today).sort();
  const dayh=(d,open)=>{const dr=rs.filter(r=>day(r.d)===d),y=rec(dr);return `<details class=evday${open?" open":""}><summary><span>${new Date(d+"T12:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span><span class=evr>${recTxt(y)}</span></summary><div class=mrows>${dr.map(rowh).join("")}</div></details>`};
  h+=`<details class="rsec evsec" id="ev${ti}"><summary><span class=evt>${esc(t)}</span><span class=evr>${recTxt(x)}</span></summary>`
   +past.map((d,i)=>dayh(d,i===0)).join("")
   +(fut.length?`<details class=evday><summary><span>Upcoming</span><span class=evr>${rs.filter(r=>day(r.d)>today).length} lines</span></summary>${fut.map(d=>dayh(d,false)).join("")}</details>`:"")
   +`</details>`});
 document.getElementById("ev").innerHTML=h||"<p class=none>Nothing tracked yet.</p>";
 const K="openFb";let o=[];try{o=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
 document.querySelectorAll("#ev details.rsec[id]").forEach(d=>{if(o.includes(d.id))d.open=true;d.addEventListener("toggle",()=>{let s=new Set(o);d.open?s.add(d.id):s.delete(d.id);o=[...s];try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}})});
 const e=document.getElementById("evp");if(e)e.onchange=()=>{F.per=e.value;try{localStorage.setItem("evfilt",JSON.stringify(F))}catch(e){};draw()}}
draw();
</script>
