<h1>Players</h1><input id=q type=search placeholder='Search any player' autocomplete=off aria-label='Search any player' style='width:100%;font:500 15px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);margin:10px 0 4px'><div id=qres></div><script src='search.js?v=1'></script><script>const q=document.getElementById('q'),R=document.getElementById('qres');let all=null;const norm=s=>s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();q.addEventListener('input',async()=>{const v=norm(q.value.trim());if(v.length<2){R.innerHTML='';return}if(!all){try{all=await (await fetch('nfl_all.json?d='+new Date().toISOString().slice(0,13))).json()}catch(e){all={}}}const hits=Object.entries(all).map(([id,p])=>[id,p,window.SR?SR.score(q.value,p.n,[p.t]):(norm(p.n).includes(v)?1:0)]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]||b[1].gp-a[1].gp).slice(0,12).map(x=>[x[0],x[1]]);const K={QB:[8,'pass yds'],RB:[6,'rush yds'],FB:[6,'rush yds'],WR:[4,'rec yds'],TE:[4,'rec yds']};R.innerHTML=hits.length?`<div class=game><div class=rows>${hits.map(([id,p])=>{const L=p.log,[c,l]=K[p.pos]||[9,'tackles'],a=L.reduce((s,r)=>s+(+r[c]||0),0)/Math.max(L.length,1);return `<a class=row href='nfl_player.html?p=${id}' style='text-decoration:none'><div class=who><span class=nmrow><img class='nface fm' src='https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png' alt='' loading=lazy onerror="this.style.visibility='hidden'"><b>${p.n}</b></span><small>${p.t} · ${p.pos} · ${p.gp} games</small></div><div class=c><b>${a.toFixed(1)}</b><small>${l}</small></div><div class=c></div></a>`}).join('')}</div></div>`:'<p class=none>No player found.</p>'});</script>
<p class=meta style="margin-top:28px">Not betting advice.</p>
<footer class="foot nfl"><i></i>Al's NFL Bets</footer></main></body></html>
