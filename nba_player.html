<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Player · Al's NBA Bets</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="brand.css?v=085cd35f"><link rel=icon href="nba_logo.jpg">
<style>
.ph{display:flex;gap:14px;align-items:center;margin:20px 0 6px}
.ph .face{width:84px;height:62px;object-fit:cover;object-position:top;border-radius:10px;background:var(--soft);flex:none}
.ph h1{margin:0;font-size:22px}
.ph .tm{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:3px;flex-wrap:wrap}
.ph .tm img{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{font:500 13px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer}
.chips button.on{background:#F27A1A;border-color:#F27A1A;color:#fff}
.rungs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0}
.rungs::-webkit-scrollbar{display:none}
.rungs button{flex:none;font:500 13px var(--body);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--fg);cursor:pointer;text-align:center;min-width:64px}
.rungs button small{display:block;font-size:11px;color:var(--muted)}
.rungs button small{color:var(--muted)}
.rungs button.val{border-color:#1F4D2E;background:#0E2215}.rungs button.val small{color:var(--accent);font-weight:600}
.rungs button.on{outline:2px solid #F27A1A;outline-offset:-1px}
.hr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.hr div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.hr b{display:block;font-size:17px}.hr span{font-size:11px;color:var(--muted)}
.hr .good b{color:var(--accent)}.hr .bad b{color:var(--bad)}
.chart{width:100%;display:block}
.chart text{font-family:var(--body)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin:12px 0}
.panel h2{margin:0 0 4px;font-size:15px}
.panel .meta{margin:0 0 6px}
.qbars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:110px;margin:26px 0 4px}
.qbars div{background:#F27A1A;border-radius:6px 6px 0 0;position:relative;min-height:2px}
.qbars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:600}
.qlab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted)}
.zt{width:100%;font-size:13px}.zt th:first-child,.zt td:first-child{text-align:left}.zt td,.zt th{padding:6px 4px}
.court{width:100%;max-width:420px;display:block;margin:4px auto;background:#14100C;border-radius:10px}
.court .ln{fill:none;stroke:#5A4632;stroke-width:.25}
.why{font-size:14px;line-height:1.55}
.untested{font-size:11px;color:var(--amber);border:1px solid #4D3B12;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
</style></head><body>
<header class="top nba"><div class=in><a class=logo href="nba.html"><img src="nba_logo.jpg" alt="Al's NBA Bets"></a>
<div class=sport role=group aria-label=Sport><a href="picks.html">Football</a><a class=on aria-current=page href="nba.html">NBA</a></div>
<nav><a href="nba.html">Tonight</a><a href="nba_minutes.html">Minutes</a><a class=on href="nba_players.html">Players</a><a href="nba_results.html">Results</a></nav></div></header>
<main id=app><p class=none>Loading…</p></main>
<footer class="foot nba"><i></i>Al's NBA Bets</footer>
<script>
const ESPN_FACE = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const LOGO = ab => `https://a.espncdn.com/i/teamlogos/nba/500/${ab.toLowerCase()}.png`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// log row: [date, min, pts, reb, ast, fg3m, started, q1m, q2m, q3m, q4m, q1pts, q1reb, q1ast]
const STATS = [
  {k:"pts", label:"Points", col:2, mk:"Points"}, {k:"reb", label:"Rebounds", col:3, mk:"Rebounds"},
  {k:"ast", label:"Assists", col:4, mk:"Assists"}, {k:"fg3m", label:"Threes", col:5, mk:"Threes Made"},
  {k:"min", label:"Minutes", col:1}, {k:"q1pts", label:"1Q Points", col:11, mk:"1st Quarter Points", q1:"pts"},
  {k:"q1reb", label:"1Q Rebounds", col:12, mk:"1st Quarter Rebounds", q1:"reb"}, {k:"q1ast", label:"1Q Assists", col:13, mk:"1st Quarter Assists", q1:"ast"},
  {k:"q1min", label:"1Q Minutes", col:7}];
const pid = new URLSearchParams(location.search).get("p");
// same rules as the Tonight list: projection 1.2x the line, 5%+ EV, odds 15 or shorter
const isValue = (r, proj, q1) => r[3] >= 5 && r[1] <= (q1 ? 6 : 15) && proj / (r[0] - 0.5) >= 1.2;
let S = {stat: "pts", k: null};

fetch("nba_data.json?v=" + Date.now()).then(r => r.json()).then(data => {
  let P, T, G, O;
  for (const g of data.games) for (const t of g.teams) for (const p of t.players)
    if (p.pid === pid) { P = p; T = t; G = g; O = g.teams.find(x => x !== t); }
  const app = document.getElementById("app");
  if (!P) { app.innerHTML = "<p class=none>Player not in tonight's games. <a class=fmap href='nba_players.html'>All players</a></p>"; return; }
  document.title = `${P.name} · Al's NBA Bets`;
  const tip = new Date(G.tip).toLocaleString("en-GB", {weekday:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/London"});
  const rungsFor = st => st.q1 ? (P.q1.mk || {})[st.mk] || [] : st.mk ? P.mk[st.mk] || [] : [];
  const projFor = st => st.q1 ? P.q1.proj[st.q1] : st.k === "min" ? P.exp_m : st.k === "q1min" ? P.q1.exp : P.proj[st.k];
  // default stat: the market with the best value rung
  let best = null;
  for (const st of STATS) for (const r of rungsFor(st)) if (!st.q1 && isValue(r, projFor(st)) && (!best || r[3] > best.r[3])) best = {st, r};
  if (best) { S.stat = best.st.k; S.k = best.r[0]; }

  function render() {
    const st = STATS.find(s => s.k === S.stat);
    const rungs = rungsFor(st), proj = projFor(st);
    if (S.k == null || !rungs.find(r => r[0] === S.k)) {
      const near = rungs.length ? rungs.reduce((a, b) => Math.abs(b[0] - 0.5 - proj) < Math.abs(a[0] - 0.5 - proj) ? b : a) : null;
      S.k = near ? near[0] : Math.max(1, Math.round(proj));
    }
    const k = S.k, vals = P.log.map(r => r[st.col]);
    const hit = xs => xs.length ? Math.round(100 * xs.filter(v => v >= k).length / xs.length) : 0;
    const hrs = [["L5", vals.slice(-5)], ["L10", vals.slice(-10)], ["Season", vals]];
    const rung = rungs.find(r => r[0] === k);
    const last = P.log.slice(-15);
    // bar chart
    const W = 340, H = 170, pad = 22, bw = (W - pad) / Math.max(last.length, 1);
    const mx = Math.max(k * 1.4, ...last.map(r => r[st.col]), 1);
    const y = v => H - 22 - (H - 40) * v / mx;
    let bars = "";
    last.forEach((r, i) => {
      const v = r[st.col], x = pad + i * bw + 2, ok = v >= k;
      bars += `<rect x="${x}" y="${y(v)}" width="${bw - 4}" height="${Math.max(1, H - 22 - y(v))}" rx="3" fill="${ok ? "#4ADE80" : "#F87171"}" opacity="${r[6] ? 1 : .7}"/>`
            + `<text x="${x + (bw - 4) / 2}" y="${y(v) - 4}" text-anchor="middle" font-size="10" fill="#F5F5F5">${v}</text>`
            + `<text x="${x + (bw - 4) / 2}" y="${H - 8}" text-anchor="middle" font-size="8" fill="#9A9A9A">${r[0].slice(3)}</text>`;
    });
    const line = `<line x1="${pad}" x2="${W}" y1="${y(k - 0.5)}" y2="${y(k - 0.5)}" stroke="#F27A1A" stroke-width="1.5" stroke-dasharray="4 3"/>`
               + `<text x="2" y="${y(k - 0.5) + 3}" font-size="10" fill="#F27A1A">${k}+</text>`;
    const projLine = `<line x1="${pad}" x2="${W}" y1="${y(proj)}" y2="${y(proj)}" stroke="#F5F5F5" stroke-width="1" opacity=".35"/>`;
    const chart = `<svg class=chart viewBox="0 0 ${W} ${H}" role=img aria-label="${esc(st.label)} last ${last.length} games">${projLine}${bars}${line}</svg>`;
    const rungBtns = rungs.map(r => `<button data-k="${r[0]}" class="${isValue(r, proj, st.q1) ? "val" : ""} ${r[0] === k ? "on" : ""}">${r[0]}+ @ ${r[1].toFixed(2)}<small>${r[3] > 0 ? "+" : ""}${r[3].toFixed(0)}% EV</small></button>`).join("");
    const verdict = rung ? `<p class=meta>bet365 ${rung[1].toFixed(2)} (${(100 / rung[1]).toFixed(0)}%) · model ${rung[2].toFixed(0)}% · `
                         + `<b class="${isValue(rung, proj, st.q1) ? "pos" : rung[3] < 0 ? "neg" : ""}">${rung[3] > 0 ? "+" : ""}${rung[3].toFixed(0)}% EV</b>${isValue(rung, proj, st.q1) ? " · value" : ""}${st.q1 ? "<span class=untested>untested</span>" : ""}</p>` : "";
    document.getElementById("stat").innerHTML =
      `<div class=chips>${STATS.map(s => `<button data-s="${s.k}" class="${s.k === S.stat ? "on" : ""}">${s.label}</button>`).join("")}</div>`
      + `<div class=panel><h2>${esc(st.label)}: projection ${proj.toFixed(1)}</h2>`
      + `<p class=meta>Last ${last.length} · faded = bench · grey = projection</p>`
      + chart + (rungs.length ? `<div class=rungs>${rungBtns}</div>` : `<p class=meta>No bet365 props for this yet.</p>`) + verdict
      + `<div class=hr>${hrs.map(([l, xs]) => { const h = hit(xs); return `<div class="${h >= 60 ? "good" : h < 40 ? "bad" : ""}"><b>${h}%</b><span>${l} ${k}+</span></div>`; }).join("")}`
      + `<div><b>${(vals.reduce((a, b) => a + b, 0) / Math.max(vals.length, 1)).toFixed(1)}</b><span>season avg</span></div></div></div>`;
    document.querySelectorAll("#stat .chips button").forEach(b => b.onclick = () => { S.stat = b.dataset.s; S.k = null; render(); });
    document.querySelectorAll("#stat .rungs button").forEach(b => b.onclick = () => { S.k = +b.dataset.k; render(); });
  }

  // minutes + quarters
  const qmax = Math.max(...P.q_avg, 1);
  const qbars = P.q_avg.map((v, i) => `<div style="height:${100 * v / qmax}%"><span>${v.toFixed(1)}</span></div>`).join("");
  const extra = [P.boost >= 0.5 ? `+${P.boost.toFixed(0)} (${esc(P.boost_for[0].split(" ").slice(-1)[0])} out)` : "", P.adj < 1 ? "blowout cut" : "", P.b2b ? "B2B" : ""].filter(Boolean).join(" · ");
  const minsHtml = `<div class=panel><h2>Minutes</h2>
    <div class=hr><div><b>${P.exp_m.toFixed(1)}</b><span>tonight</span></div><div><b>${P.season.min.toFixed(1)}</b><span>season</span></div>
    <div><b>${P.l5.min.toFixed(1)}</b><span>last 5</span></div><div><b>${P.q1.exp.toFixed(1)}</b><span>Q1 tonight</span></div></div>
    ${extra ? `<p class=meta>${extra}</p>` : ""}
    <div class=qbars>${qbars}</div>
    <div class=qlab>${P.q_avg.map((v, i) => `<span>Q${i + 1} · ${P.q_share[i]}%</span>`).join("")}</div></div>`;

  // shot chart (ESPN coords: x 0-50 across, basket at (25,0), baseline y=-5.25)
  const sh = P.shots || {bins: [], zones: {}, n: 0};
  const bmax = Math.max(...sh.bins.map(b => b[2]), 1);
  const rects = sh.bins.map(([bx, by, a, m]) => {
    const x = bx * 2, yy = by * 2 - 6 + 5.25;
    if (x < 0 || x > 50 || yy < 0 || yy > 47) return "";
    const pct = a ? m / a : 0;
    return `<rect x="${x}" y="${yy}" width="2" height="2" fill="#F27A1A" opacity="${(0.15 + 0.85 * Math.sqrt(a / bmax)).toFixed(2)}"><title>${a} shots, ${m} made (${Math.round(100 * pct)}%)</title></rect>`;
  }).join("");
  const B = 5.25, arc = r => `M ${25 - r} ${B} A ${r} ${r} 0 0 0 ${25 + r} ${B}`;
  const court = `<svg class=court viewBox="0 0 50 47" role=img aria-label="Shot locations this season">
    ${rects}
    <rect class=ln x="0" y="0" width="50" height="47"/>
    <rect class=ln x="17" y="0" width="16" height="19"/>
    <circle class=ln cx="25" cy="19" r="6"/>
    <path class=ln d="M 3 0 L 3 ${B + 8.75} A 23.75 23.75 0 0 0 47 ${B + 8.75} L 47 0"/>
    <path class=ln d="${arc(4)}" transform="scale(1,-1) translate(0,${-2 * B})"/>
    <circle class=ln cx="25" cy="${B}" r=".75"/><line class=ln x1="22" x2="28" y1="${B - 1.25}" y2="${B - 1.25}"/>
  </svg>`;
  const ZORDER = ["At the rim", "Paint", "Mid-range", "Corner 3", "Above-break 3"];
  const ztot = Object.values(sh.zones).reduce((a, z) => a + z[0], 0) || 1;
  const zrows = ZORDER.filter(z => sh.zones[z]).map(z => { const [a, m] = sh.zones[z];
    return `<tr><td class=pl>${z}</td><td>${Math.round(100 * a / ztot)}%</td><td>${a}</td><td>${Math.round(100 * m / a)}%</td></tr>`; }).join("");
  const shotHtml = `<div class=panel><h2>Shot map</h2><p class=meta>${sh.n} shots this season</p>
    ${court}<div class=tw><table class=zt><tr><th>Zone</th><th>Share</th><th>Shots</th><th>Made</th></tr>${zrows}</table></div></div>`;

  const tags = (P.inj ? `<span class="nba-tag ${P.inj.toLowerCase() === "out" ? "out" : "dtd"}">${esc(P.inj)}</span>` : "")
             + (P.start ? `<span class="nba-tag st">Starting</span>` : "")
             + (P.delta >= 4 ? `<span class="nba-tag up">+${P.delta.toFixed(0)} min</span>` : "");
  app.innerHTML = `<div class=ph><img class=face src="${ESPN_FACE(P.pid)}" alt="" onerror="this.style.visibility='hidden'">
    <div><h1>${esc(P.name)}</h1><div class=tm><img src="${LOGO(T.abbr)}" alt="">${esc(T.full || T.abbr)} · vs ${esc(O.abbr)} · ${tip}${tags}</div></div></div>
    <div class=kv style="margin-top:12px"><div><b>${P.exp_m.toFixed(1)}</b><span>exp min</span></div><div><b>${P.proj.pts.toFixed(1)}</b><span>pts</span></div>
    <div><b>${P.proj.reb.toFixed(1)}</b><span>reb</span></div><div><b>${P.proj.ast.toFixed(1)}</b><span>ast</span></div><div><b>${P.proj.fg3m.toFixed(1)}</b><span>3pm</span></div></div>
    <div id=stat></div>${minsHtml}${shotHtml}
    <p class=meta>Photos and logos: ESPN · not betting advice</p>`;
  render();
}).catch(e => { document.getElementById("app").innerHTML = "<p class=none>Couldn't load player data.</p>"; });
</script></body></html>
