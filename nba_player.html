<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Player · Al's NBA Bets</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="brand.css?v=6222f8aa"><link rel=icon href="nba_logo.jpg">
<style>
.ph{display:flex;gap:14px;align-items:center;margin:20px 0 6px}
.ph .face{width:84px;height:62px;object-fit:cover;object-position:top;border-radius:10px;background:var(--soft);flex:none}
.ph h1{margin:0;font-size:22px}
.ph .tm{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:3px;flex-wrap:wrap}
.ph .tm img{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{font:500 13px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer}
.chips button.on{background:#F27A1A;border-color:#F27A1A;color:#fff}
.chips.range{margin:4px 0 2px}.chips.range button{font-size:12px;padding:4px 10px}
.chips.range button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.rungs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0;justify-content:safe center}
.rungs::-webkit-scrollbar{display:none}
.rungs button{flex:none;font:500 13px var(--body);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--fg);cursor:pointer;text-align:center;min-width:64px}
.rungs button small{display:block;font-size:11px;color:var(--muted)}
.rungs button small{color:var(--muted)}
.rungs button.val{border-color:#1F4D2E;background:#0E2215}.rungs button.val small{color:var(--accent);font-weight:600}
.rungs button.on{outline:2px solid #F27A1A;outline-offset:-1px}
.mover{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.mover input{flex:1;accent-color:#F27A1A;height:28px}
.mover button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 18px var(--body);cursor:pointer}
.hr{display:flex;gap:6px;margin:10px 0}.hr div{flex:1;min-width:0}
.hr div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.hr b{display:block;font-size:17px}.hr span{font-size:10px;color:var(--muted);white-space:nowrap}
.hr .good b{color:var(--accent)}.hr .bad b{color:var(--bad)}
.chart{width:100%;display:block}
.chart text{font-family:var(--body)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;margin:12px 0}
.panel h2{margin:0 0 4px;font-size:15px}
.panel .meta{margin:0 0 6px}
.qbars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:110px;margin:26px 0 4px}
.qbars div{background:#F27A1A;border-radius:6px 6px 0 0;position:relative;min-height:2px}
.qbars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;font-weight:600}
.qlab{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted)}
.zt{width:100%;font-size:13px}.zt th:first-child,.zt td:first-child{text-align:left}.zt td,.zt th{padding:6px 4px}
.court{width:100%;max-width:420px;display:block;margin:4px auto;background:#14100C;border-radius:10px}
.court .ln{fill:none;stroke:#5A4632;stroke-width:.25}
.why{font-size:14px;line-height:1.55}
.untested{font-size:11px;color:var(--amber);border:1px solid #4D3B12;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
</style></head><body>
<header class="top nba"><div class=in><a class=logo href="nba.html"><img src="nba_logo.jpg" alt="Al's NBA Bets"></a>
<div class=sport role=group aria-label=Sport><a href="picks.html">Football</a><a class=on aria-current=page href="nba.html">NBA</a></div>
<nav><a href="nba.html">Tonight</a><a href="nba_minutes.html">Minutes</a><a class=on href="nba_players.html">Players</a><a href="nba_results.html">Results</a></nav></div></header>
<main id=app><p class=none>Loading…</p></main>
<footer class="foot nba"><i></i>Al's NBA Bets</footer>
<script>
const ESPN_FACE = id => `https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const LOGO = ab => `https://a.espncdn.com/i/teamlogos/nba/500/${ab.toLowerCase()}.png`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// log row: [date, min, pts, reb, ast, fg3m, started, q1m, q2m, q3m, q4m, q1pts, q1reb, q1ast]
const STATS = [
  {k:"pts", label:"Points", col:2, mk:"Points"}, {k:"reb", label:"Rebounds", col:3, mk:"Rebounds"},
  {k:"ast", label:"Assists", col:4, mk:"Assists"}, {k:"fg3m", label:"Threes", col:5, mk:"Threes Made"},
  {k:"min", label:"Minutes", col:1}, {k:"q1pts", label:"1Q Points", col:11, mk:"1st Quarter Points", q1:"pts"},
  {k:"q1reb", label:"1Q Rebounds", col:12, mk:"1st Quarter Rebounds", q1:"reb"}, {k:"q1ast", label:"1Q Assists", col:13, mk:"1st Quarter Assists", q1:"ast"},
  {k:"q1min", label:"1Q Minutes", col:7}];
const pid = new URLSearchParams(location.search).get("p");
// model chance of k+ for any line (mirrors nba_props.prob / q1_prob)
function erfc(x) { const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
  const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return x >= 0 ? r : 2 - r; }
function tailP(k, mu, cal) {
  if (!cal || mu <= 0) return null;
  mu *= cal.b || 1;
  if (cal.dist === "normal") return 0.5 * erfc((k - 0.5 - mu) / (cal.c * Math.sqrt(mu) * Math.SQRT2));
  let pj, cdf = 0;
  if (cal.dist === "negbin") { const r = cal.r, q = mu / (r + mu); pj = Math.pow(r / (r + mu), r);
    for (let j = 0; j < k; j++) { cdf += pj; pj *= (j + r) / (j + 1) * q; } }
  else { pj = Math.exp(-mu); for (let j = 0; j < k; j++) { cdf += pj; pj *= mu / (j + 1); } }
  return Math.max(0, 1 - cdf); }
// same rules as the Tonight list: projection 1.2x the line, 5%+ EV, odds 15 or shorter
const isValue = (r, proj, q1) => r[3] >= 5 && r[1] <= (q1 ? 6 : 15) && proj / (r[0] - 0.5) >= 1.2;
let S = {stat: "pts", k: null, n: 15};

Promise.all([fetch("nba_data.json?v=" + Date.now()).then(r => r.json()),
             fetch("nba_prev.json?d=" + new Date().toISOString().slice(0, 10)).then(r => r.ok ? r.json() : {}).catch(() => ({}))]).then(([data, prevAll]) => {
  const CAL = (data.settings || {}).cal || {}, Q1CAL = (data.settings || {}).q1cal || {};
  let P, T, G, O;
  for (const g of data.games) for (const t of g.teams) for (const p of t.players)
    if (p.pid === pid) { P = p; T = t; G = g; O = g.teams.find(x => x !== t); }
  const app = document.getElementById("app");
  if (!P) { app.innerHTML = "<p class=none>Player not in tonight's games. <a class=fmap href='nba_players.html'>All players</a></p>"; return; }
  document.title = `${P.name} · Al's NBA Bets`;
  const tip = new Date(G.tip).toLocaleString("en-GB", {weekday:"short", hour:"2-digit", minute:"2-digit", timeZone:"Europe/London"});
  const rungsFor = st => st.q1 ? (P.q1.mk || {})[st.mk] || [] : st.mk ? P.mk[st.mk] || [] : [];
  const projFor = st => st.q1 ? P.q1.proj[st.q1] : st.k === "min" ? P.exp_m : st.k === "q1min" ? P.q1.exp : P.proj[st.k];
  // default stat: the market with the best value rung
  let best = null;
  for (const st of STATS) for (const r of rungsFor(st)) if (!st.q1 && isValue(r, projFor(st)) && (!best || r[3] > best.r[3])) best = {st, r};
  if (best) { S.stat = best.st.k; S.k = best.r[0]; }

  const PREV = prevAll[P.pid] || [];
  const ALL = PREV.concat(P.log);                       // L10/L15/L25 reach back into last season if needed
  const games = () => S.n === 0 ? P.log : ALL.slice(-S.n);
  const RANGES = [[10, "L10"], [15, "L15"], [25, "L25"], [0, "This season"]];

  function render() {
    const st = STATS.find(s => s.k === S.stat);
    const rungs = rungsFor(st), proj = projFor(st);
    if (S.k == null) {
      const near = rungs.length ? rungs.reduce((a, b) => Math.abs(b[0] - 0.5 - proj) < Math.abs(a[0] - 0.5 - proj) ? b : a) : null;
      S.k = near ? near[0] : Math.max(1, Math.round(proj));
    }
    const vals = P.log.map(r => r[st.col]);
    const top = Math.max(5, Math.ceil(Math.max(...vals, proj) * 1.2));
    document.getElementById("stat").innerHTML =
      `<div class=chips>${STATS.map(s => `<button data-s="${s.k}" class="${s.k === S.stat ? "on" : ""}">${s.label}</button>`).join("")}</div>`
      + `<div class=panel><h2>${esc(st.label)} · proj ${proj.toFixed(1)}${(() => { const m = (P.mult || {})[st.k]; const so = (T.star_out || []).map(n => n.split(" ").slice(-1)[0] + " out").join(", "); return m && (Math.abs(m - 1) >= 0.03 || so) ? ` <span class="nba-tag ${m > 1 ? "up" : "out"}">${so ? so + " · " : ""}${m > 1 ? "+" : ""}${Math.round(100 * (m - 1))}%</span>` : ""; })()}</h2>`
      + `<div class="chips range">${RANGES.map(([n, l]) => `<button data-n="${n}" class="${n === S.n ? "on" : ""}">${l}</button>`).join("")}</div>`
      + `<div id=chartbox></div>`
      + `<div class=mover><button id=kdown aria-label="Lower line">−</button><input id=kslide type=range min=1 max=${top} step=1 value=${S.k} aria-label="Move the line"><button id=kup aria-label="Raise line">+</button></div>`
      + (rungs.length ? `<div class=rungs>${rungs.map(r => `<button data-k="${r[0]}">${r[0]}+ @ ${r[1].toFixed(2)}<small></small></button>`).join("")}</div>` : "")
      + `<div class=hr id=hitrates></div></div>`;
    document.querySelectorAll("#stat .chips:not(.range) button").forEach(b => b.onclick = () => { S.stat = b.dataset.s; S.k = null; render(); });
    document.querySelectorAll("#stat .chips.range button").forEach(b => b.onclick = () => { S.n = +b.dataset.n; render(); });
    document.querySelectorAll("#stat .rungs button").forEach(b => b.onclick = () => { S.k = +b.dataset.k; draw(); });
    const sl = document.getElementById("kslide");
    sl.oninput = () => { S.k = +sl.value; draw(); };
    document.getElementById("kdown").onclick = () => { S.k = Math.max(1, S.k - 1); draw(); };
    document.getElementById("kup").onclick = () => { S.k = Math.min(top, S.k + 1); draw(); };
    draw();
  }

  function draw() {
    const st = STATS.find(s => s.k === S.stat);
    const rungs = rungsFor(st), proj = projFor(st), k = S.k;
    const vals = P.log.map(r => r[st.col]), last = games();
    const rung = rungs.find(r => r[0] === k);
    const cal = st.q1 ? Q1CAL[st.q1] : CAL[st.k];
    const pm = rung ? rung[2] / 100 : tailP(k, proj, cal);
    const ev = rung ? rung[3] : null;
    // chart: stat bars, with a minutes line drawn through them (right-hand scale, 0-48)
    const n = last.length + 1, W = 340, H = 212, pad = 22, padR = 18, bw = (W - pad - padR) / n, gap = Math.min(4, bw * 0.25);
    const base = H - 34, topY = 26;                        // room under the bars for opponent logos + dates
    const mx = Math.max(k * 1.3, proj * 1.1, ...last.map(r => r[st.col]), 1);
    const y = v => base - (base - topY) * v / mx;
    const q1m = !!st.q1 || st.k === "q1min";                 // 1st-quarter stats: show Q1 minutes only (0-12)
    const mcol = q1m ? 7 : 1, mMax = q1m ? 12 : 48;
    const ym = m => base - (base - topY) * Math.min(m, mMax) / mMax;
    const showVals = bw >= 13, every = Math.ceil(n / 6);
    const dm = d => { const [m, dd] = d.slice(-5).split("-"); return `${+dd}/${+m}`; };
    let bars = "", pts = [], dots = "", labels = "";
    last.forEach((r, i) => {
      const v = r[st.col], x = pad + (last.length - i) * bw + gap / 2, w = bw - gap, cx = x + w / 2;   // newest on the left, after tonight
      bars += `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(1, base - y(v))}" rx="${Math.min(3, w / 3)}" fill="${v >= k ? "#4ADE80" : "#F87171"}" opacity="${r[6] ? .95 : .55}"><title>${r[0]}: ${v} in ${r[1]} min</title></rect>`
            + (showVals ? `<text x="${cx}" y="${y(v) - 4}" text-anchor="middle" font-size="10" fill="#F5F5F5">${v}</text>` : "");
      pts.push(`${cx.toFixed(1)},${ym(r[mcol]).toFixed(1)}`);
      dots += `<circle cx="${cx}" cy="${ym(r[mcol])}" r="${bw >= 10 ? 1.8 : 1.1}" fill="#60A5FA"><title>${r[mcol]} min${q1m ? " in Q1" : ""}</title></circle>`;
      if (i % every === 0) labels += `<text x="${cx}" y="${H - 4}" text-anchor="middle" font-size="7.5" fill="#9A9A9A">${dm(r[0])}</text>`;
      const ls = Math.min(12, w);
      if (r[14]) labels += `<image href="${LOGO(r[14])}" x="${cx - ls / 2}" y="${base + 4}" width="${ls}" height="${ls}"><title>v ${r[14]}</title></image>`;
    });
    // tonight: dashed projection bar + hollow expected-minutes dot
    const tx = pad + gap / 2, tw = bw - gap, tcx = tx + tw / 2, expM = q1m ? P.q1.exp : P.exp_m;
    const lastPt = pts[pts.length - 1];
    const tonight = `<rect x="${tx}" y="${y(proj)}" width="${tw}" height="${Math.max(1, base - y(proj))}" rx="${Math.min(3, tw / 3)}" fill="none" stroke="#F5F5F5" stroke-width="1" stroke-dasharray="3 2" opacity=".7"><title>Tonight: projection ${proj.toFixed(1)}</title></rect>`
      + `<text x="${tcx}" y="${y(proj) - 4}" text-anchor="middle" font-size="9" fill="#F5F5F5" opacity=".75">${proj.toFixed(1)}</text>`
      + (lastPt ? `<line x1="${lastPt.split(",")[0]}" y1="${lastPt.split(",")[1]}" x2="${tcx}" y2="${ym(expM)}" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 2" opacity=".75"/>` : "")
      + `<circle cx="${tcx}" cy="${ym(expM)}" r="2.4" fill="#000" stroke="#60A5FA" stroke-width="1.1"><title>Expected ${expM.toFixed(1)} min${q1m ? " in Q1" : ""} tonight</title></circle>`
      + `<text x="${tcx}" y="${ym(expM) - 5}" text-anchor="middle" font-size="7" fill="#93C5FD">${expM.toFixed(0)}</text>`
      + `<image href="${LOGO(O.abbr)}" x="${tcx - Math.min(12, tw) / 2}" y="${base + 4}" width="${Math.min(12, tw)}" height="${Math.min(12, tw)}"><title>v ${O.abbr} tonight</title></image>`
      + `<text x="${tcx}" y="${H - 4}" text-anchor="middle" font-size="7.5" fill="#F27A1A">Tonight</text>`;
    const minsLine = tonight + `<polyline points="${pts.join(" ")}" fill="none" stroke="#60A5FA" stroke-width="1" stroke-linejoin="round" opacity=".75"/>${dots}`
      + `<text x="${W - 2}" y="${ym(mMax) + 3}" text-anchor="end" font-size="6.5" fill="#60A5FA" opacity=".6">${mMax}</text><text x="${W - 2}" y="${ym(mMax / 2) + 3}" text-anchor="end" font-size="6.5" fill="#60A5FA" opacity=".6">${mMax / 2}</text>`
      + `<line x1="${W - (q1m ? 40 : 34)}" x2="${W - (q1m ? 32 : 26)}" y1="9" y2="9" stroke="#60A5FA" stroke-width="1"/><text x="${W - 2}" y="11.5" text-anchor="end" font-size="7" fill="#9A9A9A">${q1m ? "Q1 mins" : "mins"}</text>`;
    const mins = minsLine + labels;
    const ly = y(k - 0.5);
    const tag = rung ? `${k}+ · ${rung[1].toFixed(2)} · ${ev > 0 ? "+" : ""}${ev.toFixed(0)}% EV` : pm != null ? `${k}+ · fair ${(1 / Math.max(pm, 0.001)).toFixed(2)}` : `${k}+`;
    const tagW = tag.length * 4.3 + 8;
    const good = rung && isValue(rung, proj, st.q1), bad = rung && ev < 0;
    const col = good ? "#4ADE80" : bad ? "#F87171" : "#F27A1A";
    document.getElementById("chartbox").innerHTML = `<svg class=chart viewBox="0 0 ${W} ${H}" role=img aria-label="${esc(st.label)} last ${last.length} games">`
      + `<line x1="${pad}" x2="${W - padR}" y1="${y(proj)}" y2="${y(proj)}" stroke="#F5F5F5" stroke-width=".6" opacity=".2"/>${bars}${mins}`
      + `<line x1="${pad}" x2="${W - padR}" y1="${ly}" y2="${ly}" stroke="${col}" stroke-width="1" stroke-dasharray="3 2"/>`
      + `<rect x="${W - padR - tagW}" y="${ly - 12}" width="${tagW}" height="10" rx="3" fill="#000" opacity=".85"/>`
      + `<text x="${W - padR - tagW / 2}" y="${ly - 4.5}" text-anchor="middle" font-size="7.5" font-weight="600" fill="${col}">${tag}</text></svg>`;
    document.getElementById("kslide").value = k;
    document.querySelectorAll("#stat .rungs button").forEach(b => { const r = rungs.find(x => x[0] === +b.dataset.k);
      b.className = (isValue(r, proj, st.q1) ? "val " : "") + (+b.dataset.k === k ? "on" : "");
      b.querySelector("small").textContent = `${r[3] > 0 ? "+" : ""}${r[3].toFixed(0)}% EV`; });
    const hit = xs => xs.length ? Math.round(100 * xs.filter(v => v >= k).length / xs.length) : 0;
    const prevVals = PREV.map(r => r[st.col]);
    document.getElementById("hitrates").innerHTML = [["L5", vals.slice(-5)], ["L10", vals.slice(-10)], ["Season", vals]].concat(prevVals.length ? [["Last yr", prevVals]] : []).map(([l, xs]) => {
      const h = hit(xs); return `<div class="${h >= 60 ? "good" : h < 40 ? "bad" : ""}"><b>${h}%</b><span>${l} ${k}+</span></div>`; }).join("")
      + `<div><b>${(vals.reduce((a, b) => a + b, 0) / Math.max(vals.length, 1)).toFixed(1)}</b><span>avg</span></div>`;
  }

  // minutes + quarters
  const qmax = Math.max(...P.q_avg, 1);
  const qbars = P.q_avg.map((v, i) => `<div style="height:${100 * v / qmax}%"><span>${v.toFixed(1)}</span></div>`).join("");
  const extra = [P.boost >= 0.5 ? `+${P.boost.toFixed(0)} (${esc(P.boost_for[0].split(" ").slice(-1)[0])} out)` : "", P.adj < 1 ? "blowout cut" : "", P.b2b ? "B2B" : ""].filter(Boolean).join(" · ");
  const minsHtml = `<div class=panel><h2>Minutes</h2>
    <div class=hr><div><b>${P.exp_m.toFixed(1)}</b><span>tonight</span></div><div><b>${P.season.min.toFixed(1)}</b><span>season</span></div>
    <div><b>${P.l5.min.toFixed(1)}</b><span>last 5</span></div><div><b>${P.q1.exp.toFixed(1)}</b><span>Q1 tonight</span></div></div>
    ${extra ? `<p class=meta>${extra}</p>` : ""}
    <div class=qbars>${qbars}</div>
    <div class=qlab>${P.q_avg.map((v, i) => `<span>Q${i + 1} · ${P.q_share[i]}%</span>`).join("")}</div></div>`;

  // shot chart (ESPN coords: x 0-50 across, basket at (25,0), baseline y=-5.25)
  const sh = P.shots || {bins: [], zones: {}, n: 0};
  const bmax = Math.max(...sh.bins.map(b => b[2]), 1);
  const rects = sh.bins.map(([bx, by, a, m]) => {
    const x = bx * 2, yy = by * 2 - 6 + 5.25;
    if (x < 0 || x > 50 || yy < 0 || yy > 47) return "";
    const pct = a ? m / a : 0;
    return `<rect x="${x}" y="${yy}" width="2" height="2" fill="#F27A1A" opacity="${(0.15 + 0.85 * Math.sqrt(a / bmax)).toFixed(2)}"><title>${a} shots, ${m} made (${Math.round(100 * pct)}%)</title></rect>`;
  }).join("");
  const B = 5.25, arc = r => `M ${25 - r} ${B} A ${r} ${r} 0 0 0 ${25 + r} ${B}`;
  const court = `<svg class=court viewBox="0 0 50 47" role=img aria-label="Shot locations this season">
    ${rects}
    <rect class=ln x="0" y="0" width="50" height="47"/>
    <rect class=ln x="17" y="0" width="16" height="19"/>
    <circle class=ln cx="25" cy="19" r="6"/>
    <path class=ln d="M 3 0 L 3 ${B + 8.75} A 23.75 23.75 0 0 0 47 ${B + 8.75} L 47 0"/>
    <path class=ln d="${arc(4)}" transform="scale(1,-1) translate(0,${-2 * B})"/>
    <circle class=ln cx="25" cy="${B}" r=".75"/><line class=ln x1="22" x2="28" y1="${B - 1.25}" y2="${B - 1.25}"/>
  </svg>`;
  const ZORDER = ["At the rim", "Paint", "Mid-range", "Corner 3", "Above-break 3"];
  const ztot = Object.values(sh.zones).reduce((a, z) => a + z[0], 0) || 1;
  const zrows = ZORDER.filter(z => sh.zones[z]).map(z => { const [a, m] = sh.zones[z];
    return `<tr><td class=pl>${z}</td><td>${Math.round(100 * a / ztot)}%</td><td>${a}</td><td>${Math.round(100 * m / a)}%</td></tr>`; }).join("");
  const shotHtml = `<div class=panel><h2>Shot map</h2><p class=meta>${sh.n} shots this season</p>
    ${court}<div class=tw><table class=zt><tr><th>Zone</th><th>Share</th><th>Shots</th><th>Made</th></tr>${zrows}</table></div></div>`;

  const tags = (P.inj ? `<span class="nba-tag ${P.inj.toLowerCase() === "out" ? "out" : "dtd"}">${esc(P.inj)}</span>` : "")
             + (P.start ? `<span class="nba-tag st">Starting</span>` : "")
             + (P.delta >= 4 ? `<span class="nba-tag up">+${P.delta.toFixed(0)} min</span>` : "");
  app.innerHTML = `<div class=ph><img class=face src="${ESPN_FACE(P.pid)}" alt="" onerror="this.style.visibility='hidden'">
    <div><h1>${esc(P.name)}</h1><div class=tm><img src="${LOGO(T.abbr)}" alt="">${esc(T.full || T.abbr)} · vs ${esc(O.abbr)} · ${tip}${tags}</div></div></div>
    <div class=kv style="margin-top:12px"><div><b>${P.exp_m.toFixed(1)}</b><span>exp min</span></div><div><b>${P.proj.pts.toFixed(1)}</b><span>pts</span></div>
    <div><b>${P.proj.reb.toFixed(1)}</b><span>reb</span></div><div><b>${P.proj.ast.toFixed(1)}</b><span>ast</span></div><div><b>${P.proj.fg3m.toFixed(1)}</b><span>3pm</span></div></div>
    <div id=stat></div>${minsHtml}${shotHtml}
    <p class=meta>Photos and logos: ESPN · not betting advice</p>`;
  render();
}).catch(e => { document.getElementById("app").innerHTML = "<p class=none>Couldn't load player data.</p>"; });
</script></body></html>
