 let h=`<div class=lchips><span class=lab>Strategy</span>${ST.filter(s=>LR.some(r=>r.s===s)).map(s=>chip("s",s,s,F.s.includes(s),COL[s])).join("")}</div>`
  +`<div class=lchips><span class=lab>Rungs</span>${["Main line","2nd rung","3rd rung"].map((l,i)=>chip("rung",i,l,F.rung.includes(i))).join("")}<span class=lab style="margin-left:8px">Chart</span>${chip("split","1",F.split?"Split by strategy":"All as one",true)}</div>`
  +`<div class=fpills><label class=fpill><select id=lg>${[["all","Same + cross game"],["same","Same game"],["cross","Cross game"]].map(([v,l])=>`<option value=${v}${v===F.g?" selected":""}>${l}</option>`).join("")}</select></label><label class=fpill><select id=lp>${[["all","All time"],["month","This month"],["week","This week"]].map(([v,l])=>`<option value=${v}${v===F.per?" selected":""}>${l}</option>`).join("")}</select></label></div>`
  +`<p class=msum>${fmt(x)}</p>`
  +chart(F.split?F.s.map(s=>({col:COL[s],rs:sel.filter(r=>r.s===s)})):[{col:x.p>=0?"#4ADE80":"#F87171",rs:one}])
  +`<div class=lleg>${F.s.map(s=>{const y=sum(sel.filter(r=>r.s===s));return y.n||y.open?`<div><span><i style="display:inline-block;width:10px;height:3px;background:${COL[s]};vertical-align:middle;margin-right:6px"></i>${esc(s)}</span><span class=evr>${y.n} · <span class=${y.p>=0?"pos":"neg"}>${y.p>=0?"+":""}${y.p.toFixed(2)}u</span> · ROI ${y.k?((y.p/y.k*100>=0?"+":"")+(y.p/y.k*100).toFixed(0)):"0"}%</span></div>`:""}).join("")}</div>`
  +`<div class=mrows>`+one.map(r=>{const d=done(r),P=plOf(r),tags=sel.filter(q=>q.key===r.key).map(q=>`<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COL[q.s]};margin-right:3px"></i>`).join("");
    return `<div class=mrow><span class=gfaces>${r.l.map(g=>g[3]?`<img class="nface fm" src="${IMG}playerimages/${g[3]}.png" alt="" loading=lazy onerror="this.style.visibility='hidden'">`:`<span class="nface fm"></span>`).join("")}</span>`
     +`<span class=mw><b>${r.l.map(g=>esc(g[0].split(" ").slice(-1)[0])+" "+esc(g[1])).join(" + ")}</b><small style="white-space:normal">${tags}${new Date(r.d+"Z").toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · ${r.x?"cross":"same game"} · ${r.r.map((q,i)=>`<span style="opacity:${F.rung.includes(i)?1:.4}">${q[5]||q[0]+"/"+q[0]} ${q[1].toFixed(2)}${q[3]==="W"?" ✅":q[3]==="L"?" ❌":""}</span>`).join(" · ")}${r.v?` · got ${r.v[0]}/${r.v[1]}`:""}</small></span>`
     +`<span class="mres ${d?(P>=0?"pos":"neg"):""}"><b>${d?(P>=0?"+":"")+P.toFixed(2):"open"}</b></span></div>`}).join("")+`</div>`;
 document.getElementById("lr").innerHTML=LR.length?h:"<p class=none>No ladders yet.</p>";
 document.querySelectorAll(".lchips button").forEach(b=>b.onclick=()=>{const g=b.dataset.g,v=b.dataset.v;
  if(g==="split")F.split=!F.split;else{const val=g==="rung"?+v:v,a=F[g],i=a.indexOf(val);if(i>=0){if(a.length>1)a.splice(i,1)}else a.push(val)}save();draw()});
 const on=(id,k)=>{const e=document.getElementById(id);if(e)e.onchange=()=>{F[k]=e.value;save();draw()}};on("lg","g");on("lp","per");
}
draw();
</script>
<p class=meta style="margin-top:28px">Not betting advice.</p>
<footer class=foot><i></i>Al's Card Bets</footer></main>
<script>
const K="openFb";let o=[];try{o=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
document.querySelectorAll("details[id]").forEach(d=>{if(o.includes(d.id))d.open=true;d.addEventListener("toggle",()=>{
let s=new Set(o);d.open?s.add(d.id):s.delete(d.id);o=[...s];try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}})});
</script></body></html>
