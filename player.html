<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Player · Al's Card Bets</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="brand.css"><link rel=icon href="logo.jpg"></head><body>
<header class=top><div class=in><a class=logo href="football.html"><img src="logo.jpg" alt="Al's Card Bets"></a><div class=sport role=group aria-label=Sport><a class=on aria-current=page href="football.html">Football</a><a href="nba.html">NBA</a><a href="nhl.html">NHL</a><a href="nfl.html">NFL</a><a href="darts.html">Darts</a><a href="cricket.html">Cricket</a></div><nav><a href="football.html">Fixtures</a><a href="props.html">Props</a><a href="picks.html">Cards</a><a class=on href="players.html">Players</a><a href="index.html">Results</a></nav></div></header>
<main class=wide><div id=app><p class=meta>Loading…</p></div>
<p class=meta style="margin-top:28px">Not betting advice.</p>
<footer class=foot><i></i>Al's Card Bets</footer></main>
<script>
const IMG="https://images.fotmob.com/image_resources/";
const STATS=[["shots","Shots"],["sot","Shots on target"],["hsot","Headed SOT"],["osot","SOT outside box"],["fouls","Fouls"],["fouled","Fouls won"],["tackles","Tackles"],["cards","Booked"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pid=new URLSearchParams(location.search).get("p");
const app=document.getElementById("app");
const logo=tid=>tid?`<img class=tlogo src="${IMG}logo/teamlogo/${tid}_small.png" alt="" loading=lazy onerror="this.remove()">`:"";
const B365='<img class=bk src="books/bet365.png" alt="bet365">';
let FXI={ids:new Set(),pid:{}};
const fxUrl=id=>id&&FXI.ids.has(String(id))?`football.html?g=${encodeURIComponent(id)}`:"";
fetch("fx_index.json").then(r=>r.json()).then(j=>{FXI={ids:new Set(j.ids||[]),pid:j.pid||{}};if(DD)draw(DD)}).catch(()=>{});
fetch(`p/${encodeURIComponent(pid)}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(draw).catch(()=>{
  app.innerHTML="<h1>Player</h1><p class=none>No stats for this player yet. They appear once they're in a game with bet365 props.</p><p><a class=fmap href='players.html'>All players</a></p>"});

function bars(rows,key,k){ // oldest left, newest right
  const R=rows.slice().reverse(), n=R.length, W=600, H=150, pad=6, bw=(W-2*pad)/Math.max(n,1);
  const vals=R.map(r=>r[5][key]??0), mx=Math.max(k+1,...vals,1), Y=v=>H-24-(H-44)*v/mx;
  let s=`<svg class=pchart viewBox="0 0 ${W} ${H}" role=img aria-label="Last ${n} games">`;
  R.forEach((r,i)=>{const v=vals[i],x=pad+i*bw+bw*.15,w=bw*.7,hit=v>=k;
    s+=`<g><title>${esc(r[0])} v ${esc(r[1])} · ${v}</title><rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-24-Y(v)).toFixed(1)}" rx="3" fill="${hit?"#4ADE80":"#F87171"}" opacity="${hit?1:.75}"/>`+
       `<text x="${(x+w/2).toFixed(1)}" y="${(Y(v)-4).toFixed(1)}" text-anchor="middle" class=bv>${v}</text>`+
       `<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(r[0])}</text></g>`});
  const ly=Y(k-.5);
  s+=`<line x1="${pad}" x2="${W-pad}" y1="${ly.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="#888" stroke-dasharray="4 4"/></svg>`;
  return s}

// ---------- NBA-style stat card (same look as the fixtures player card): newest on the left after a dashed Next bar,
// minutes as a faint background line, bet365 rows on the right (tap to set the line), Super Sub stacked in purple ----------
const VAL_P=0.55, VAL_EV=0.10, MAX_ODDS=15, SS_COL="#A78BFA";   // value rule from props_calibration.json (backtest)
const CH={key:"shots", k:null, ss:false, proj:true};
CH.ss=true;const ssKey=()=>"fxss_"+((typeof DD!=="undefined"&&DD&&DD.next&&DD.next.fid)||"");   // Super Sub per game (same key as Fixtures)
// filters (remembered per visitor): range, competitions (empty = all), club / country
const FL={range:"season", comps:[], side:"both"};
// only the range carries over between players: a club/comp/position picked on one player can leave another with no games
try{const sv=JSON.parse(localStorage.getItem("pfilt")||"{}");if(typeof sv.range==="string")FL.range=sv.range}catch(e){}
const saveFL=()=>{try{localStorage.setItem("pfilt",JSON.stringify({range:FL.range}))}catch(e){}};
const seasonStart=(()=>{const t=new Date(),y=t.getMonth()>=6?t.getFullYear():t.getFullYear()-1;return `${y}-07-01`})();
const lastStart=`${+seasonStart.slice(0,4)-1}-07-01`;
if(!Array.isArray(FL.pos))FL.pos=[];
function baseRows(rows){return rows.filter(r=>(FL.side==="both"||(FL.side==="club"?r[11]===1:r[11]===0))&&(!FL.comps.length||FL.comps.includes(r[10]))&&(!FL.pos.length||FL.pos.includes(r[12])))}
function rangeRows(rows,range){
  if(range==="season")return rows.filter(r=>(r[9]||"")>=seasonStart);
  if(range==="last")return rows.filter(r=>(r[9]||"")>=lastStart&&(r[9]||"")<seasonStart);
  if(range==="all")return rows;
  return rows.slice(0,+range)}
function filtered(rows){const hasDates=rows.some(r=>r[9]), b=baseRows(rows), f=rangeRows(b,!hasDates&&(FL.range==="season"||FL.range==="last")?"all":FL.range); return f.length?f:b.slice(0,10)}   // empty range (e.g. no starts this season) -> his last 10
function filterBar(rows){
  const b=baseRows(rows), ranges=[["5","L5"],["10","L10"],["20","L20"],["30","L30"],["50","L50"],["season","This season"],["last","Last season"],["all","All"]]
    .filter(([k])=>k==="all"||k==="season"||(k==="last"?rangeRows(b,"last").length:b.length>+k));
  const comps=[...new Set(rows.map(r=>r[10]).filter(Boolean))], hasNat=rows.some(r=>r[11]===0)&&rows.some(r=>r[11]===1);
  const ps=[...new Set(rows.map(r=>r[12]).filter(Boolean))];
  const sel=(id,opts,cur)=>`<label class=fpill><select id=${id}>${opts.map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  return `<div class=fpills>`
    +sel("frange",ranges.map(([k,l])=>[k,["season","last","all"].includes(k)?`${l} (${rangeRows(b,k).length})`:l]),FL.range)
    +(hasNat?sel("fside",[["both","All games"],["club","Club"],["country","Country"]],FL.side):"")
    +(comps.length>1?sel("fcomp",[["","All comps"],...comps.map(c=>[c,c])],FL.comps[0]||""):"")
    +(ps.length>1?sel("fpos",[["","Any position"],...ps.map(p=>[p,p])],FL.pos[0]||""):"")
    +`</div>`;
}
function series(rows,key){ // oldest first
  const R=rows.slice().reverse();
  return {R, v:R.map(r=>r[5][key]??0), vs:R.map(r=>(r[8]&&r[8][key])||0)};
}
const BOOK={bet365:"bet365",betmgm:"betmgm",paddypower:"paddypower",skybet:"skybet",williamhill:"williamhill",betfair:"betfair",betfred:"betfred"};
const bookImg=n=>{const k=BOOK[String(n||"bet365").toLowerCase().replace(/\s/g,"")]; return k?`<img class=fx-bk src="books/${k}.png" alt="${esc(n)}">`:""};
// Markets where bet365 offers Super Sub: waiting on Alex to confirm, so SS EV is shown but picks stay on non-SS EV.
// bet365 Sub On Play On (Alex 16 Nov): these markets, in the competitions on bet365's list (next.ss, pricer/supersub.py)
const SUPER_SUB_MARKETS={shots:1,sot:1,hsot:1,osot:1,fouls:1,fouled:1,tackles:1};
const ssHere=(nx,key)=>!!(nx&&nx.ss&&SUPER_SUB_MARKETS[key]);
const dedup=rs=>{const m=new Map();for(const r of rs){const o=m.get(r[0]);if(!o||r[1]>o[1])m.set(r[0],r)}return [...m.values()].sort((a,b)=>a[0]-b[0])};
function rungsBoth(nx,key){   // {base, ss}: one row per line each
  const base=dedup((nx&&nx.lines&&nx.lines[key])||[]), ss=ssHere(nx,key)?dedup((nx&&nx.lines_ss&&nx.lines_ss[key])||[]):[];
  if(key==="cards"&&!base.length&&G){const x=G.cards[String(DD.pid)]; if(x&&x.best&&x.fair)return {base:[[1,x.best,1/x.fair,x.edge,0,0,x.book]],ss:[]}}
  return {base,ss};
}
function rungsOf(nx,key){const b=rungsBoth(nx,key); return CH.ss&&ssHere(nx,key)&&b.ss.length?b.ss:b.base}   // [k, odds, model 0-1, EV 0-1, ..., book]
function otherEV(nx,key,k){const b=rungsBoth(nx,key), o=(CH.ss&&ssHere(nx,key)?b.base:b.ss).find(r=>r[0]===k); return o?o[3]:null}
const pct=v=>`${v>0?"+":""}${Math.round(100*v)}%`;
const isVal=r=>r&&r[2]>=VAL_P&&r[3]>=VAL_EV&&r[1]<=MAX_ODDS;
function defK(rs,proj,vals){
  const v=rs.filter(isVal).sort((a,b)=>b[3]-a[3])[0]; if(v)return v[0];
  const pr=proj??(vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:1);
  if(rs.length)return rs.reduce((a,b)=>Math.abs(b[0]-.5-pr)<Math.abs(a[0]-.5-pr)?b:a)[0];
  return Math.max(1,Math.round(pr));
}
function statCard(d){
  const rows=filtered(d.rows||[]), nx=d.next, key=CH.key, S=series(rows,key);
  const SSON=CH.ss&&ssHere(nx,key);
  const tot=SSON?S.v.map((v,i)=>v+S.vs[i]):S.v, hasSS=S.vs.some(x=>x);
  const rs=rungsOf(nx,key);
  const projAll=nx&&nx.proj?(SSON&&nx.proj[key+"_ss"]!=null?nx.proj[key+"_ss"]:nx.proj[key]):null;
  if(!S.v.length)return `<div class="fx-card pcardx"><div class=fx-ctl2>${filterBar(d.rows||[])}</div><p class=meta>No games match these filters.</p></div>`;
  if(CH.k==null)CH.k=key==="cards"?1:defK(rs,projAll,tot);
  const k=CH.k, n=S.v.length, vals=tot.slice(-n), raw=S.v.slice(-n), subs=SSON?S.vs.slice(-n):null, gs=S.R.slice(-n);
  const proj=CH.proj?projAll:null;
  const posOn=gs.some(r=>r[12]), W=620,H=posOn?230:220,pad=24,padR=14,cols=n+(proj!=null?1:0),bw=(W-pad-padR)/Math.max(cols,1),gap=Math.min(4,bw*.25),base=H-(posOn?42:32),topY=10;
  const posMain=(()=>{const c={};gs.forEach(r=>{if(r[12])c[r[12]]=(c[r[12]]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]})();
  const mx=Math.max((k-.5)*1.3,(proj||0)*1.1,...vals,1), y=v=>base-(base-topY)*v/mx, ym=m=>base-(base-topY)*Math.min(m,90)/90;
  const off=proj!=null?1:0, every=Math.ceil(cols/7);
  let bars="",pts=[],labels="";
  for(let j=0;j<n;j++){
    const i=n-1-j, v=vals[i], sb=subs?subs[i]:0, r=gs[i], x=pad+(j+off)*bw+gap/2, w=bw-gap, cx=x+w/2, ok=v>=k;
    if(sb)bars+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(1,y(v-sb)-y(v))}" fill="${SS_COL}"><title>Super Sub: +${sb} (${esc(r[8]&&r[8].name)})</title></rect>`;
    const gu=fxUrl(r[7]);
    bars+=(gu?`<a href="${gu}">`:"")+`<rect x="${x}" y="${y(v-sb)}" width="${w}" height="${Math.max(1,base-y(v-sb))}" rx="${Math.min(3,w/3)}" fill="${ok?"#4ADE80":"#F87171"}" opacity="${r[4]===0?.5:.95}"><title>${esc(r[0])} v ${esc(r[1])}: ${v}${r[4]===0?" (off the bench)":""}</title></rect>`+(gu?"</a>":"")
      +(bw>=13?(base-y(v)>=14?`<text x="${cx}" y="${y(v)+10}" text-anchor=middle font-size=9 font-weight=600 fill="#000" opacity=".7">${v}</text>`:`<text x="${cx}" y="${y(v)-3}" text-anchor=middle font-size=9 fill="#F5F5F5">${v}</text>`):"");
    pts.push(`${cx.toFixed(1)},${ym(r[3]).toFixed(1)}`);
    const ls=Math.min(12,w); if(r[2])labels+=`<image href="${IMG}logo/teamlogo/${r[2]}_small.png" x="${cx-ls/2}" y="${base+4}" width="${ls}" height="${ls}"><title>v ${esc(r[1])}</title></image>`;
    if(posOn&&r[12]&&bw>=11)labels+=`<text x="${cx}" y="${base+26}" text-anchor=middle font-size="${bw>=16?7.5:6.5}"${r[12]===posMain?` fill="#7A7A7A"`:` fill="#F5F5F5" font-weight=700`}>${esc(r[12])}</text>`;
    if((j+off)%every===0)labels+=`<text x="${cx}" y="${H-3}" text-anchor=middle font-size=7.5 fill="#9A9A9A">${esc(r[0])}</text>`;
  }
  let next="";
  if(proj!=null){const x=pad+gap/2,w=bw-gap,cx=x+w/2;
    next=`<rect x="${x}" y="${y(proj)}" width="${w}" height="${Math.max(1,base-y(proj))}" rx="${Math.min(3,w/3)}" fill=none stroke="#F5F5F5" stroke-dasharray="3 2" opacity=".7"><title>Next: projection ${(+proj).toFixed(1)}</title></rect><text x="${cx}" y="${H-3}" text-anchor=middle font-size=7.5 fill="#F27A1A">Next</text>`;
    if(nx&&nx.exp_min!=null)pts.unshift(`${cx.toFixed(1)},${ym(nx.exp_min).toFixed(1)}`);}
  const mins=pts.length>1?`<polyline points="${pts.join(" ")}" fill=none stroke="#60A5FA" stroke-width="1" opacity=".45"/>`:"";
  const rung=rs.find(r=>r[0]===k), col=rung?(isVal(rung)?"#4ADE80":rung[3]<0?"#F87171":"#F27A1A"):"#F27A1A", ly=y(k-.5), kl=key==="cards"?"Booked":`${k}+`;
  const hits=vals.filter(v=>v>=k).length, hitsRaw=raw.filter(v=>v>=k).length, avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  return `<div class="fx-card pcardx">`
    +`<div class=fx-mks>${STATS.map(([kk,l])=>`<button data-m="${kk}" class="${kk===key?"on":""}">${l.replace("Shots on target","SOT").replace("Fouls won","Fouled")}</button>`).join("")}`
    +`</div>`
    +`<div class=fx-body><div class=fx-left><div class=fx-chart><div class="fx-lt plt"><b style="color:${col}">${kl}${rung?` · ${rung[1].toFixed(2)} · ${pct(rung[3])} EV`:""}</b>`
      +`<span class=plt-r><button id=pshare class=sharebtn title="Share as image" aria-label="Share as image"><svg viewBox="0 0 24 24" width=15 height=15 fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>`
      +`${ssHere(nx,key)?`<button id=pss class="sspill${SSON?" on":""}" aria-pressed="${SSON}" title="Super Sub">SS</button>`:""}</span></div>`
    +`<div class=pchartw><svg class=chart viewBox="0 0 ${W} ${H}" role=img aria-label="${esc(key)} last ${n}">${mins}${bars}${next}${labels}<line x1="${pad}" x2="${W-padR}" y1="${ly}" y2="${ly}" stroke="${col}" stroke-dasharray="3 2"/><text x="${pad-3}" y="${ly+3}" text-anchor=end font-size=7.5 font-weight=600 fill="${col}">${esc(kl)}</text></svg>`
      +`${projAll!=null?`<button id=pproj class="projbtn${CH.proj?" on":""}" aria-pressed="${CH.proj}" title="Projection"><svg viewBox="0 0 12 14" width=12 height=14><rect x="2" y="2" width="8" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-dasharray="2 1.5"/></svg></button>`:""}</div></div>`
    +`<div class=fx-hr><b>${hits}/${vals.length}</b>${SSON&&hitsRaw!==hits?` <small>(${hitsRaw} without SS)</small>`:""} · avg ${avg.toFixed(1)}${projAll!=null?` · proj ${(+projAll).toFixed(1)}`:""}</div>`
    +`<div class=fx-ctl2>${filterBar(d.rows||[])}`
    +(key==="cards"?"":`<div class="fx-mv pmv"><button data-d=-1 aria-label="Lower the line">−</button><input type=range min=1 max="${Math.max(5,Math.ceil(Math.max(...tot,projAll||0)*1.3))}" step=1 value="${k}" aria-label="Move the line"><button data-d=1 aria-label="Raise the line">+</button><span>${kl}</span></div>`)
    +`</div></div><div class=fx-side><div class=fx-rt>${rs.map(r=>`<button data-k="${r[0]}" class="fx-pr${isVal(r)?" val":""}${r[0]===k?" on":""}">${bookImg(r[6])}<span>${key==="cards"?"Booked":r[0]+"+"}<small> · ${vals.filter(v=>v>=r[0]).length}/${vals.length}</small></span><b>${r[1].toFixed(2)}</b><b class=fx-ev style="color:${isVal(r)?"#4ADE80":r[3]<0?"#F87171":"#F27A1A"}">${pct(r[3])}</b></button>`).join("")||""}</div><div id=pside></div></div></div></div>`;
}
// Share: the stat card as a PNG (player header + chart + prices), via the phone share sheet or a download.
// FotMob images have no CORS headers, so faces/logos are loaded through wsrv.nl (free image proxy) for the capture only.
function loadH2C(){return window.html2canvas?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const PX=src=>"https://wsrv.nl/?url="+encodeURIComponent(src.replace(/^https?:\/\//,""))+"&w=128&output=png";
const PXC={};   // proxied images already fetched (warmed in the background so Share is quick)
const DURL={};  // chart badges (SVG <image>) as data URLs: an SVG drawn by html2canvas never loads outside images itself
const dataUrl=src=>DURL[src]||(DURL[src]=fetch(PX(src)).then(r=>r.ok?r.blob():null).then(b=>b?new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>res(null);f.readAsDataURL(b)}):null).catch(()=>null));
const svgImgs=root=>[...root.querySelectorAll("svg image")].map(im=>[im,im.getAttribute("href")||im.getAttribute("xlink:href")||""]).filter(([,h])=>/^https?:/.test(h));
function warmShare(){   // after the page draws: load html2canvas + the card's faces/logos through the proxy, idle time
  const go=()=>{loadH2C().catch(()=>{});
    document.querySelectorAll("#app img").forEach(im=>{const src=im.getAttribute("src")||"";
      if(/^https?:/.test(src)&&!src.startsWith(location.origin)&&!src.includes("wsrv.nl")&&!PXC[src]){const w=new Image();w.crossOrigin="anonymous";w.src=PX(src);PXC[src]=w}});
    svgImgs(document.getElementById("app")||document).forEach(([,h])=>dataUrl(h))};
  (window.requestIdleCallback||(f=>setTimeout(f,1200)))(go)}
async function shareCard(d,btn,el,tag){
  const card=el||document.querySelector("#pchart .pcardx"); if(!card)return;
  btn.disabled=true; btn.classList.add("busy");
  try{
    await loadH2C();
    const nx=d.next||{}, wrap=document.createElement("div");
    wrap.className="shotwrap";
    const ko=nx.ko?new Date(nx.ko).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"}):"";
    wrap.innerHTML=`<div class=shothead><img class=shotface src="${IMG}playerimages/${encodeURIComponent(d.pid)}.png" alt=""><div><b>${esc(d.name||"")}</b>`
      +`<small>${esc(d.team||"")}${nx.game?` · ${esc(nx.game)}${ko?` · ${ko}`:""}`:""}</small></div></div>`;
    const c=card.cloneNode(true);
    c.querySelectorAll(".fx-ctl2,#pshare,#pproj,.pmv,.sharebtn").forEach(e=>e.remove());
    wrap.appendChild(c);
    wrap.insertAdjacentHTML("beforeend",`<div class=shotfoot><span>Al's Card Bets</span><span>alsfootytips.github.io/alscardbets</span></div>`);
    document.body.appendChild(wrap);
    await Promise.all([...wrap.querySelectorAll("img")].map(im=>new Promise(res=>{
      const src=im.getAttribute("src")||""; if(/^https?:/.test(src)&&!src.startsWith(location.origin)&&!src.includes("wsrv.nl")){im.crossOrigin="anonymous";im.src=PX(src)}
      if(im.complete&&im.naturalWidth)return res(); im.onload=res; im.onerror=()=>{im.remove();res()}; setTimeout(res,2500)})));
    await Promise.all(svgImgs(wrap).map(async([im,h])=>{const u=await Promise.race([dataUrl(h),new Promise(r=>setTimeout(()=>r(null),2500))]);
      if(u){im.setAttribute("href",u);im.removeAttribute("xlink:href")}else im.remove()}));
    const cv=await html2canvas(wrap,{backgroundColor:"#000",scale:1.5,useCORS:true,logging:false,imageTimeout:2500});
    wrap.remove();
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const name=`${(d.name||"player").replace(/\W+/g,"-").toLowerCase()}-${tag||CH.key||"stats"}.png`, file=new File([blob],name,{type:"image/png"});
    // phones (iOS) only open the share sheet straight after a tap, and making the image takes a moment: show it in a popup
    // with its own Share / Save buttons (a fresh tap); long-press the image also saves it to Photos
    const url=URL.createObjectURL(blob), canShare=navigator.canShare&&navigator.canShare({files:[file]});
    const ov=document.createElement("div"); ov.className="shotov";
    ov.innerHTML=`<div class=shotbox><img src="${url}" alt="Share image"><div class=shotbtns>${canShare?`<button class=shotgo data-a=share>Share</button>`:""}`
      +`<a class=shotgo download="${name}" href="${url}">Save</a><button class=shotx data-a=close>Close</button></div></div>`;
    ov.onclick=async ev=>{const a=ev.target.closest("[data-a]"); if(ev.target===ov||(a&&a.dataset.a==="close")){ov.remove();URL.revokeObjectURL(url);return}
      if(a&&a.dataset.a==="share"){try{await navigator.share({files:[file]})}catch(e){}}};
    document.body.appendChild(ov);
  }catch(e){console.error(e);alert("Couldn't make the image")}
  finally{btn.disabled=false;btn.classList.remove("busy");document.querySelectorAll(".shotwrap").forEach(w=>w.remove())}
}
function wireCard(d){

  if(!all.length)return shotRange()+`<p class=meta><b>0 shots</b> · ${span}</p>`;
  const T={R:"Right foot",L:"Left foot",H:"Header",O:"Other"}, k=8, W=68*k, H=52.5*k;
  const keep=s=>(SF.t==="A"||s.t===SF.t)&&(SF.box==="A"||(SF.box==="in"?s.ib===1:s.ib===0))&&(!SF.on||s.on);
  const P=s=>[(s.y*k).toFixed(1),((105-s.x)*k).toFixed(1)];
  let svg=`<svg class=smap viewBox="0 0 ${W} ${H}" role=img aria-label="Shot map"><rect width="${W}" height="${H}" fill="#0E2215" rx="8"/>`+
    `<g fill="none" stroke="#2F5A3C" stroke-width="2"><rect x="${13.84*k}" y="0" width="${40.32*k}" height="${16.5*k}"/><rect x="${24.84*k}" y="0" width="${18.32*k}" height="${5.5*k}"/>`+
    `<line x1="0" y1="${H-1}" x2="${W}" y2="${H-1}"/><path d="M ${(34-9.15)*k} ${H} A ${9.15*k} ${9.15*k} 0 0 1 ${(34+9.15)*k} ${H}"/><path d="M ${(34-7.3)*k} ${16.5*k} A ${9.15*k} ${9.15*k} 0 0 0 ${(34+7.3)*k} ${16.5*k}"/></g>`+
    `<rect x="${30.34*k}" y="-4" width="${7.32*k}" height="8" fill="#ddd"/>`;
  all.filter(keep).forEach(s=>{const [cx,cy]=P(s),r=5+Math.sqrt(s.xg||0)*18,col=s.g?"#FBBF24":s.on?"#4ADE80":"#9CA3AF";
    svg+=`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="${col}" fill-opacity="${s.g||s.on?.9:.45}" stroke="#000" stroke-width="1"><title>v ${esc(s.o)} · ${s.d}${s.m!=null?` · ${s.m}'`:""} · ${T[s.t]} · ${s.ib===0?"Outside box":"Inside box"} · ${s.g?"Goal":s.on?"On target":"Off target"}${s.xg!=null?` · xG ${(+s.xg).toFixed(2)}`:""}</title></circle>`});
  svg+="</svg>";
  const cnt=f=>all.filter(s=>keep({...s,...f})).length;
  const sel=all.filter(keep).length, games=rows.length;
  const lab=`${{A:"",R:"Right-foot ",L:"Left-foot ",H:"Headed "}[SF.t]}${SF.on?"SOT":"shots"}${SF.box==="in"?" inside box":SF.box==="out"?" outside box":""}`;
  return shotRange()+`<div class=seg id=sf>${[["A","All"],["R","Right"],["L","Left"],["H","Header"]].map(([t,l])=>`<button data-t="${t}"${SF.t===t?" class=on":""}>${l} ${all.filter(s=>(t==="A"||s.t===t)&&(SF.box==="A"||(SF.box==="in"?s.ib===1:s.ib===0))&&(!SF.on||s.on)).length}</button>`).join("")}</div>`
    +`<div class=seg id=sfb>${[["A","Any"],["in","Inside box"],["out","Outside box"]].map(([b,l])=>`<button data-b="${b}"${SF.box===b?" class=on":""}>${l} ${all.filter(s=>(SF.t==="A"||s.t===SF.t)&&(b==="A"||(b==="in"?s.ib===1:s.ib===0))&&(!SF.on||s.on)).length}</button>`).join("")}<button data-on=1${SF.on?" class=on":""}>On target</button></div>`
    +`<p class=meta><b>${sel} ${lab}</b> · ${span} · ${(sel/Math.max(games,1)).toFixed(2)} a game · <span style="color:#4ADE80">●</span> on target <span style="color:#9CA3AF">●</span> off <span style="color:#FBBF24">●</span> goal</p>`
    +svg+`<p class=meta id=sinfo></p>`}

function draw(d){
  document.title=`${d.name} · Al's Card Bets`;
  const rows=d.rows||[], nx=d.next;
  let h=`<div class=phead><img class="nface fm big" src="${IMG}playerimages/${d.pid}.png" alt="" onerror="this.style.visibility='hidden'"><div><h1>${esc(d.name)}</h1>`+
    `<p class=meta>${logo(d.tid)}${esc(d.team)}${d.pos?" · "+esc(d.pos):""}</p>`+
    (nx?((u,t)=>`<p class=meta>Next: ${u?`<a class=pnext href="${u}">${t}</a>`:t}</p>`)(fxUrl(FXI.pid[String(d.pid)]||nx.fid),
      `${logo(nx.team.id)}${esc(nx.team.name)} v ${logo(nx.opp.id)}${esc(nx.opp.name)} · ${new Date(nx.ko).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"})}`):
     (fxUrl(FXI.pid[String(d.pid)])?`<p class=meta>Next: <a class=pnext href="${fxUrl(FXI.pid[String(d.pid)])}">Game view</a></p>`:""))+
    `</div></div>`;
  const pr=(nx&&nx.lines)||{}, firstPriced=STATS.find(([kk])=>(pr[kk]||[]).length);
  if(firstPriced)CH.key=firstPriced[0];
  h+=`<div id=pchart>${statCard(d)}</div><div id=ppanel></div>`;
  app.innerHTML=h;
  DD=d; try{CH.ss=localStorage.getItem(ssKey())!=="0"}catch(e){}; wireCard(d); drawPanel(); warmShare();
  if(d.card_game)fetch(`pg/${d.card_game}.json`).then(r=>r.json()).then(g=>{G=g;document.getElementById("pchart").innerHTML=statCard(d);wireCard(d);drawPanel()}).catch(()=>{});
  const K="openFb";let o=[];try{o=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
  app.querySelectorAll("details[id]").forEach(dd=>{if(o.includes(dd.id))dd.open=true;dd.addEventListener("toggle",()=>{
    let s=new Set(o);dd.open?s.add(dd.id):s.delete(dd.id);o=[...s];try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}})});
}
</script></body></html>
