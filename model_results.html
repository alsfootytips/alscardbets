  const sel=(id,o,c)=>`<label class=fpill><select id=${id}>${o.map(([v,l])=>`<option value="${esc(v)}"${v===c?" selected":""}>${esc(l)}</option>`).join("")}</select></label>`;
  let h=`<div class=fpills>${sel("flg",[["","All leagues"],...lgs.map(l=>[l,l])],F.lg)}${sel("fmk",[["","All markets"],...mks.map(m=>[m,m])],F.mk)}${sel("fper",[["all","All time"],["month","This month"],["week","This week"]],F.per)}${sel("frule",[["cur","Current rule"],["all","All rules"],["green","All green lines"]],F.rule)}</div>`
    +`<p class=msum>${note?`<span class=muted>${note}</span><br>`:""}${fmt(x)}</p>${chart(bs.filter(b=>b.res==="W"||b.res==="L"))}`;
  for(const m of mks){const mb=bs.filter(b=>b.mk===m); if(!mb.length)continue; const y=sum(mb);
    h+=`<details class=rsec id="mk_${esc(m)}" open><summary><h2>${esc(m)}</h2><b class=msm>${y.n} · ${y.n?Math.round(100*y.h/y.n):0}% · <span class=${y.p>=0?"pos":"neg"}>${y.p>=0?"+":""}${y.p.toFixed(1)}u</span></b></summary><div class=mrows>`
      +mb.map(b=>{const P=pl(b),r=b.res;return `<a class=mrow href="player.html?p=${b.pid}"><img class="nface fm" src="${IMG}playerimages/${b.pid}.png" alt="" loading=lazy onerror="this.style.visibility='hidden'">`
        +`<span class=mw><b>${esc(b.name)}</b><small>${esc(b.mk)} ${b.k}+ · ${new Date(b.ko).toLocaleDateString("en-GB",{day:"numeric",month:"short"})} · ${esc(b.game||"")}</small></span>`
        +`<span class=mo><b>${b.o.toFixed(2)}</b><small>${b.p!=null?Math.round(100*b.p)+"%":""}</small></span>`
        +`<span class="mres ${r==="W"?"pos":r==="L"?"neg":""}"><b>${r==="W"||r==="L"?(P>=0?"+":"")+P.toFixed(2):r==="V"?"void":"–"}</b><small>${b.val!=null?"got "+b.val:""}</small></span></a>`}).join("")+`</div></details>`}
  document.getElementById("mr").innerHTML=h||"<p class=none>No picks yet.</p>";
  const on=(id,k)=>{const e=document.getElementById(id); if(e)e.onchange=()=>{F[k]=e.value;try{localStorage.setItem("mfilt",JSON.stringify(F))}catch(e){};draw()}};
  on("flg","lg");on("fmk","mk");on("fper","per");on("frule","rule");
}
draw();
</script>
