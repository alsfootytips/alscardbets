<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta http-equiv=refresh content=300><title>NBA players · Al's NBA Bets</title><link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel=stylesheet><link rel=stylesheet href="brand.css?v=9472c851"><link rel=icon href="nba_logo.jpg"></head><body>
<header class="top nba"><div class=in><a class=logo href="nba.html"><img src="nba_logo.jpg" alt="Al's NBA Bets"></a><div class=sport role=group aria-label=Sport><a href="football.html">Football</a><a class=on aria-current=page href="nba.html">NBA</a><a href="nhl.html">NHL</a><a href="nfl.html">NFL</a><a href="darts.html">Darts</a><a href="cricket.html">Cricket</a></div><nav><a href="nba.html">Today</a><a href="nba_streaks.html">Streaks</a><a href="nba_minutes.html">Minutes</a><a class=on href="nba_players.html">Players</a><a href="nba_results.html">Results</a></nav></div></header><main>
<h1>Players</h1><input id=q type=search placeholder='Search any player' autocomplete=off aria-label='Search any player'><ul id=list></ul><script src="search.js?v=1"></script><script>
(function(){const q=document.getElementById('q'),L=document.getElementById('list');let all=null;
const norm=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
q.addEventListener('input',async()=>{const v=norm(q.value.trim());if(!v){L.innerHTML='';return}
if(!all){try{all=await (await fetch('nba_all.json?d='+new Date().toISOString().slice(0,13))).json()}catch(e){all={}}}
const hits=Object.entries(all).map(([id,p])=>[id,p,window.SR?SR.score(q.value,p.n):(norm(p.n).includes(v)?1:0)]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]||b[1].gp-a[1].gp).slice(0,12);
L.innerHTML=hits.map(([id,p])=>`<li><a href="nba_player.html?p=${id}"><img class=nface src="https://a.espncdn.com/i/headshots/nba/players/full/${id}.png" alt="" onerror="this.style.visibility='hidden'">${p.n}<small> ${p.t} · ${p.gp} games</small></a></li>`).join('')||'<li class=none>No player found</li>';});})();
</script><p class=none>No NBA games in the next day.</p>
<p class=meta style="margin-top:28px">Not betting advice.</p>
<footer class="foot nba"><i></i>Al's NBA Bets</footer></main>
<script>
const K="openNba";let o=[];try{o=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
document.querySelectorAll("details[id]").forEach(d=>{if(o.includes(d.id))d.open=true;d.addEventListener("toggle",()=>{
let s=new Set(o);d.open?s.add(d.id):s.delete(d.id);o=[...s];try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}})});
</script></body></html>
