<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games · Al's Card Bets</title><link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel=stylesheet><link rel=stylesheet href="brand.css?v=a3d33db3"><link rel=icon href="logo.jpg"><style>main{max-width:680px}</style></head><body>
<header class=top><div class=in><a class=logo href="picks.html"><img src="logo.jpg" alt="Al's Card Bets"></a><nav><a href="picks.html">Picks</a><a href="ranked.html">Ranked</a><a class=on href="check.html">Games</a><a href="referees.html">Referees</a><a href="index.html">Results</a></nav></div></header><main>
<h1>Games</h1>
<p class="meta">Tap a game for its foul heatmap, or search any player with a card price.</p>
<input id="q" placeholder="Search a player or team" autocomplete="off">
<ul id="list"></ul>
<div id="out"></div>
<div id="sharebox" hidden><div class="sheet"><div class="img"></div><div class="acts"><button class="send" type="button">Send to group</button><a class="save">Save image</a><button class="close" type="button">Close</button></div></div></div>
<footer class=foot><i></i>Al's Card Bets</footer></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ø/g,"o").toLowerCase();
let players = [], updated = "";
const GAMES = {};
const od = x => x == null ? "–" : String(+(+x).toFixed(2));   // 4.3333335 -> 4.33
const EXAMPLE = new URLSearchParams(location.search).has("example");
if (EXAMPLE) document.querySelector(".meta").outerHTML = '<p class="meta example">Example analysis from a past game: <b>Bournemouth v Sunderland, Sun 18 Oct 2026</b>, priced 10 minutes before kickoff. Search any player in that game. <a href="check.html">Back to live players</a></p>';
fetch((EXAMPLE ? "example.json?" : "picks_latest.json?") + Date.now()).then(r => r.json()).then(d => {
  for (const g of Object.values(d)) {
    if (g.status !== "ok") continue;
    GAMES[String(g.fotmob_id)] = g;
    if (g.priced_at > updated) updated = g.priced_at;
    for (const c of g.cards || []) if (c.best || (g.fair_only && c.fair)) players.push({...c, gid: g.fotmob_id, fair_only: !!g.fair_only, game: g.game, league: g.league, ko: g.kickoff, ref: g.referee || {}, pitch: g.pitch || [], predicted: g.lineup !== "standard", lineup: g.lineup});
    for (const b of g.bench || []) if (b.best) players.push({...b, bench: true, game: g.game, league: g.league, ko: g.kickoff, ref: g.referee || {}, pitch: [], tcards: g.tcards, predicted: g.lineup !== "standard"});
    for (const p of players) if (p.game === g.game) p.tcards = g.tcards;
  }
  document.querySelector(".meta").insertAdjacentHTML("beforeend", ` · ${players.length} players priced` + (updated ? `, updated ${new Date(updated).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}` : ""));
  const gq = new URLSearchParams(location.search).get("g");
  if (gq && GAMES[gq]) { gameView(GAMES[gq]); return; }
  const p = new URLSearchParams(location.search).get("p") || (EXAMPLE ? "Granit Xhaka" : "");
  if (p) { q.value = p; search(); } else if (!EXAMPLE) gamesList();
  if (!players.length && !EXAMPLE) out.innerHTML = '<p class="none">No players priced in the next few days yet. <a href="check.html?example">See an example analysis</a>.</p>';
}).catch(() => { out.innerHTML = '<p class="none">No games priced right now. Check back once lineups are announced.</p>'; });

const q = document.getElementById("q"), list = document.getElementById("list"), out = document.getElementById("out");
function search() {
  const t = norm(q.value.trim());
  out.innerHTML = "";
  if (t.length < 2) { list.innerHTML = ""; if (!t) gamesList(); return; }
  const hits = players.filter(p => norm(p.player).includes(t) || norm(p.team).includes(t));
  if (hits.length === 1) { list.innerHTML = ""; show(hits[0]); return; }
  list.innerHTML = hits.slice(0, 30).map((p, i) => `<li data-i="${players.indexOf(p)}">${esc(p.player)} <small>${esc(p.team)} · ${esc(p.game)} · ${new Date(p.ko).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})}${p.predicted ? " · predicted lineup" : ""}${p.bench ? " · bench" : ""}</small></li>`).join("")
    || '<li class="none">Not found. Only players with a card price in the next few days are listed.</li>';
}
q.addEventListener("input", search);
list.addEventListener("click", e => { const li = e.target.closest("li[data-i]"); if (li) { list.innerHTML = ""; show(players[+li.dataset.i]); } });


// ---------- pitch: the player v their direct opponent ----------
const NX = 12, NY = 8, L = 105, W = 68;
const DARK = true;    // site is black with white text
// pitch colours: light page = pale pitch with grey lines; dark page and the share image = dark pitch
const colours = img => (img || DARK)
  ? {line: 'stroke="rgba(255,255,255,.45)" stroke-width=".35"', own: "#ffffff", them: "#f7b3b5", ink: "#ffffff", yel: "#F2D022", red: "#ff5a5f", ora: "#ff9f43"}
  : {line: 'stroke="#B9C9B9" stroke-width=".35"', own: "#9AA79A", them: "#E8A3A5", ink: "#57534E", yel: "#D99A00", red: "#E5484D", ora: "#E07B1F"};
const PAGE = colours(false), YEL = PAGE.yel, RED = PAGE.red, ORA = PAGE.ora;
const last = n => esc(String(n || "").split(" ").slice(-1)[0]);
function heatRects(grid, flip, colour, est) {
  if (!grid) return "";
  const mx = Math.max(...grid.flat()) || 1; let s = "";
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
    const v = grid[i][j] / mx; if (v < 0.42) continue;
    const ii = flip ? NX - 1 - i : i, jj = flip ? NY - 1 - j : j;
    s += `<ellipse cx="${((ii + .5) * L / NX).toFixed(2)}" cy="${((jj + .5) * W / NY).toFixed(2)}" rx="${(L / NX * .75).toFixed(2)}" ry="${(W / NY * .75).toFixed(2)}" fill="${colour}" fill-opacity="${((est ? .1 : .15) + (est ? .35 : .6) * v).toFixed(2)}"/>`;
  }
  return `<g filter="url(#soft)">${s}</g>`;
}
function clashCell(a, b, flipA, flipB) {             // where the two heatmaps overlap most (in view coords)
  if (!a || !b) return null; let best = null;
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
    const ai = flipA ? NX - 1 - i : i, aj = flipA ? NY - 1 - j : j, bi = flipB ? NX - 1 - i : i, bj = flipB ? NY - 1 - j : j;
    const v = Math.min(a[ai][aj], b[bi][bj]); if (!best || v > best.v) best = {v, x: (i + .5) * L / NX, y: (j + .5) * W / NY};
  }
  return best;
}
function pitchSvg(p, img) {          // img: standalone SVG (inline styles) for the share card
  const C = colours(img), LN = C.line, PL = 'fill="#fff" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif"';
  const pl = p.pitch || []; if (!pl.length) return "";
  const me = pl.find(x => x.pid === p.pid); if (!me) return "";
  const opp = pl.find(x => x.side !== me.side && x.name === p.opp);
  const central = me.pos === "M" && me.y > 0.25 && me.y < 0.75;          // central midfielders get a second opponent
  const opp2 = central && opp ? pl.find(x => x.side !== me.side && x !== opp && x.name === ((p.zone_opps || [])[0] || [])[0]) : null;
  const F = me.side === "A";                           // always draw the player's team attacking left to right
  const hflip = x => (x.side === "A") !== F;           // heat grids run from the player's own goal
  const pos = x => {                                   // FotMob layout = own half, x from own goal
    let X = x.side === "H" ? x.x * 52.5 : L - x.x * 52.5, Y = x.side === "H" ? x.y * W : W - x.y * W;
    if (F) { X = L - X; Y = W - Y; } return [X, Y];
  };
  let heat = "", clash = "";
  if (opp) heat += heatRects(opp.heat, hflip(opp), C.red, opp.est);
  heat += heatRects(me.heat, hflip(me), C.yel, me.est);
  const c = opp && clashCell(me.heat, opp.heat, hflip(me), hflip(opp));
  if (c && !me.est && !opp.est) clash = `<circle cx="${c.x.toFixed(1)}" cy="${Math.min(W - 5.5, Math.max(5.5, c.y)).toFixed(1)}" r="5" fill="none" stroke="${C.ink}" stroke-width=".6" stroke-dasharray="1.6 1.2"/>`;
  const [mx, my] = pos(me), [ox, oy] = opp ? pos(opp) : [0, 0];
  const link = opp ? `<line x1="${mx.toFixed(1)}" y1="${my.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="${C.ink}" stroke-width=".5" stroke-dasharray="1.5 1" opacity=".8"/>` : "";
  const [px, py] = opp2 ? pos(opp2) : [0, 0];
  const dots = pl.filter(x => x !== me && x !== opp && x !== opp2).map(x => { const [X, Y] = pos(x);
    return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="1.5" fill="${x.side === me.side ? C.own : C.them}" opacity=".7"/>`; }).join("");
  const tag = (x, X, Y, col) => { const t = last(x.name), w = t.length * 2.3 + 3, up = Y > 8 ? -6.2 : 3.6;
    return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="2.6" fill="${col}" stroke="#172A3A" stroke-width=".7"/>
      <rect x="${(X - w / 2).toFixed(1)}" y="${(Y + up).toFixed(1)}" width="${w.toFixed(1)}" height="4.6" rx="1.2" fill="#172A3A" opacity=".85"/>
      <text x="${X.toFixed(1)}" y="${(Y + up + 3.4).toFixed(1)}" font-size="3.6" text-anchor="middle" ${PL}>${t}</text>`; };
  const lines = `<rect x="0" y="0" width="${L}" height="${W}" fill="none" ${LN}/><line x1="52.5" y1="0" x2="52.5" y2="${W}" ${LN}/>
    <circle cx="52.5" cy="34" r="9.15" fill="none" ${LN}/><rect x="0" y="13.84" width="16.5" height="40.32" fill="none" ${LN}/>
    <rect x="88.5" y="13.84" width="16.5" height="40.32" fill="none" ${LN}/>`;
  const svg = `<svg ${img ? 'xmlns="http://www.w3.org/2000/svg" width="1090" height="720"' : 'class="pitch" role="img"'} viewBox="-2 -2 ${L + 4} ${W + 4}" aria-label="${esc(p.player)} and ${esc(p.opp || "")} heatmaps">${img ? `<rect x="-2" y="-2" width="${L + 4}" height="${W + 4}" rx="2" fill="#173F24"/>` : ""}
    <defs><filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
    ${lines}${heat}${clash}${dots}${link}${opp2 ? tag(opp2, px, py, C.ora) : ""}${opp ? tag(opp, ox, oy, C.red) : ""}${tag(me, mx, my, C.yel)}
    <text x="${L - 1}" y="${W - 1.5}" font-size="3" text-anchor="end" fill="${C.ink}" opacity=".7" font-family="Inter,Helvetica,Arial,sans-serif">attacking →</text></svg>`;
  if (img) return svg;
  const ov = p.opp_overlap != null ? Math.round(p.opp_overlap * 100) : null;
  const fw = p.opp_fouls_won_raw90 ?? p.opp_fouls_won90;
  const facts = opp ? [
    fw != null ? `${last(p.opp)} wins <b>${(+fw).toFixed(1)}</b> fouls a game` : null,
    ov != null && !me.est && !opp.est ? `They share <b>${ov}%</b> of the same space` : null,
    p.fouls90 ? `${last(p.player)} commits <b>${(+p.fouls90).toFixed(1)}</b> fouls a game` : null].filter(Boolean) : [];
  const est = [me.est && last(p.player), opp && opp.est && last(p.opp)].filter(Boolean);
  return `<h3>Matchup</h3>
    <div class="vs"><span><i style="background:${YEL}"></i>${esc(p.player)}</span><b>v</b><span><i style="background:${RED}"></i>${esc(p.opp || "no direct opponent")}</span>${opp2 ? `<span class="also"><i style="background:${ORA}"></i>also ${esc(opp2.name)}</span>` : ""}</div>
    ${svg}
    ${facts.length ? `<ul class="facts">${facts.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
    ${clash ? `<p class="cap">Dashed ring: where they meet most.</p>` : ""}
    ${est.length ? `<p class="cap">No tracking data for ${est.join(" or ")}: heatmap estimated from their position.</p>` : ""}`;
}

// ---------- share card: heatmap + reasons + fair price, as an image for the group ----------
function wrap(ctx, text, maxW) {
  const words = text.split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
const loadImg = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
async function makeCard(p) {
  try { await Promise.all(["700 64px Inter", "700 34px Inter", "500 34px Inter"].map(f => document.fonts.load(f))); } catch (e) {}
  const Wd = 1080, pad = 54, F = "Inter,Helvetica,Arial,sans-serif";
  const pts = (p.points && p.points.length ? p.points : (p.why ? p.why.split(", ") : [])).slice(0, 4);
  const c = document.createElement("canvas"), ctx = c.getContext("2d");
  // measure bullets first so the card height fits them
  ctx.font = `500 36px ${F}`;
  const bl = pts.map(t => wrap(ctx, t, Wd - pad * 2 - 56));
  const svg = pitchSvg(p, true), hasPitch = !!svg;
  const Ht = 210 + 120 + (hasPitch ? 640 + 70 : 0) + 60 + bl.reduce((n, l) => n + l.length * 48 + 22, 0) + 230 + 90;
  c.width = Wd; c.height = Ht;
  ctx.fillStyle = "#0F1A24"; ctx.fillRect(0, 0, Wd, Ht);
  // header
  ctx.fillStyle = "#172A3A"; ctx.fillRect(0, 0, Wd, 150);
  ctx.fillStyle = "#1F6B2C"; ctx.fillRect(0, 150, Wd, 10); ctx.fillStyle = "#F2D022"; ctx.fillRect(0, 150, Wd, 4);
  try { const logo = await loadImg("logo.jpg"); const h = 96, w = logo.width / logo.height * h;
    ctx.fillStyle = "#F3F1F2"; ctx.beginPath(); ctx.roundRect(pad - 8, 27, w + 16, h + 6, 14); ctx.fill(); ctx.drawImage(logo, pad, 30, w, h); } catch (e) {}
  ctx.fillStyle = "#C9D3DB"; ctx.font = `600 30px ${F}`; ctx.textAlign = "right";
  ctx.fillText("To be carded", Wd - pad, 72);
  ctx.fillStyle = "#97A5B1"; ctx.font = `500 26px ${F}`;
  ctx.fillText(new Date(p.ko).toLocaleString([], {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}), Wd - pad, 112);
  ctx.textAlign = "left";
  let y = 250;
  ctx.fillStyle = "#EEF1F3"; ctx.font = `700 64px ${F}`; ctx.fillText(p.player, pad, y);
  y += 50; ctx.fillStyle = "#97A5B1"; ctx.font = `500 30px ${F}`; ctx.fillText(`${p.team} · ${p.game}`, pad, y);
  y += 40;
  if (hasPitch) {
    const im = await loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg));
    const pw = Wd - pad * 2, ph = pw * 720 / 1090;
    ctx.drawImage(im, pad, y, pw, ph); y += ph + 50;
    // legend
    ctx.font = `700 30px ${F}`;
    const dot = (x, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y - 24, 26, 26, 6); ctx.fill(); };
    dot(pad, "#F2D022"); ctx.fillStyle = "#EEF1F3"; ctx.fillText(p.player.split(" ").slice(-1)[0], pad + 38, y);
    let x = pad + 38 + ctx.measureText(p.player.split(" ").slice(-1)[0]).width + 26;
    if (p.opp) { ctx.fillStyle = "#97A5B1"; ctx.font = `500 30px ${F}`; ctx.fillText("v", x, y); x += 36; ctx.font = `700 30px ${F}`;
      dot(x, "#ff5a5f"); ctx.fillStyle = "#EEF1F3"; ctx.fillText(p.opp, x + 38, y); }
    y += 30;
  }
  // reasons
  y += 40; ctx.fillStyle = "#97A5B1"; ctx.font = `700 28px ${F}`; ctx.fillText("Why they could get booked", pad, y); y += 26;
  ctx.font = `500 36px ${F}`;
  bl.forEach(lines => {
    y += 22;
    ctx.save(); ctx.translate(pad + 14, y + 6); ctx.rotate(0.17); ctx.fillStyle = "#F2D022"; ctx.beginPath(); ctx.roundRect(-11, -16, 22, 30, 4); ctx.fill(); ctx.restore();
    lines.forEach((l, i) => { ctx.fillStyle = "#EEF1F3"; ctx.fillText(l, pad + 56, y + 18 + i * 48); });
    y += lines.length * 48;
  });
  // prices
  y += 50;
  const boxes = [[p.fair ? p.fair.toFixed(2) : "–", `fair price (${p.fair ? Math.round(100 / p.fair) : "–"}%)`],
                 [od(p.best), p.best != null ? `best · ${p.book}` : "no price yet"],
                 p.edge != null && p.edge >= 0 ? ["+" + Math.round(p.edge * 100) + "%", "value"]
                   : [(p.verdict || {}).need ? (p.verdict.need) + "+" : "–", "value from"]];
  const bw = (Wd - pad * 2 - 40) / 3;
  boxes.forEach(([big, small], i) => {
    const x = pad + i * (bw + 20), hi = i === 2 && p.edge >= 0.15;
    ctx.fillStyle = hi ? "#F2D022" : "#152331"; ctx.beginPath(); ctx.roundRect(x, y, bw, 150, 14); ctx.fill();
    ctx.fillStyle = hi ? "#172A3A" : "#EEF1F3"; ctx.font = `700 58px ${F}`; ctx.fillText(big, x + 24, y + 78);
    ctx.fillStyle = hi ? "#172A3A" : "#97A5B1"; ctx.font = `500 25px ${F}`; ctx.fillText(small, x + 24, y + 120);
  });
  y += 150 + 60;
  ctx.fillStyle = "#5E6B76"; ctx.font = `500 24px ${F}`;
  ctx.fillText("Fair price = our model's true odds. Value = best price vs fair. 18+ · gamble responsibly", pad, y);
  return c;
}
async function shareCard(p) {
  const modal = document.getElementById("sharebox"); modal.hidden = false;
  modal.querySelector(".img").innerHTML = '<p class="cap">Making the card…</p>';
  const c = await makeCard(p);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const name = p.player.replace(/[^A-Za-z0-9]+/g, "_") + "_card.png", file = new File([blob], name, {type: "image/png"});
  const url = URL.createObjectURL(blob);
  modal.querySelector(".img").innerHTML = `<img src="${url}" alt="Share card for ${esc(p.player)}">`;
  const link = location.origin + location.pathname + "?p=" + encodeURIComponent(p.player);
  const text = `${p.player} to be carded · fair ${p.fair}${p.best ? `, best ${od(p.best)} (${p.book})` : ""}`;
  const send = modal.querySelector(".send"), save = modal.querySelector(".save");
  send.hidden = !(navigator.canShare && navigator.canShare({files: [file]}));
  send.onclick = () => navigator.share({files: [file], title: text, text: text + "\n" + link}).catch(() => {});
  save.href = url; save.download = name;
}
document.addEventListener("click", e => { if (e.target.closest("#sharebox .close") || e.target.id === "sharebox") document.getElementById("sharebox").hidden = true; });

// ---------- game view: grid heatmap of where fouls happen, both lineups, last-5 fouls under each player ----------
// Vertical pitch, home team at the bottom attacking up. Heat grids are 12 (length, from own goal) x 8 (width).
function vpos(x) {               // [left, top] as 0..1; keeper ~4% from the goal line, strikers ~44% (spread rows apart)
  const d = 0.045 + Math.max(0, x.x - 0.1) / 0.77 * 0.40, l = 0.06 + 0.88 * (x.side === "H" ? x.y : 1 - x.y);
  return [l, x.side === "H" ? 1 - d : d];
}
function cellOf(x, i, j) { return x.side === "H" ? [11 - i, j] : [i, 7 - j]; }                // heat cell -> [row from top, col]
function foulGrid(players, mode) {
  // mode 0: home commit / away win; mode 1: away commit / home win. Cell = sqrt(commit x win): where the two meet.
  const C = Array.from({length: 12}, () => Array(8).fill(0)), Wn = Array.from({length: 12}, () => Array(8).fill(0));
  for (const x of players) {
    if (!x.heat || x.pos === "G") continue;
    const commits = (mode === 0) === (x.side === "H"), w = commits ? (x.f ?? 1.1) : (x.fw ?? 1.2), T = commits ? C : Wn;
    for (let i = 0; i < 12; i++) for (let j = 0; j < 8; j++) { const [r, c] = cellOf(x, i, j); T[r][c] += x.heat[i][j] * w; }
  }
  const G = C.map((row, r) => row.map((v, c) => Math.sqrt(v * Wn[r][c])));
  const mx = Math.max(...G.flat()) || 1;
  return G.map(row => row.map(v => v / mx));
}
// Only the hottest spots get colour: top 3 squares solid red, next 5 faint red, everything else blank.
const HOT = 3, WARM = 5;
function shadeGrid(grid) {
  const flat = grid.flat().filter(v => v > 0).sort((a, b) => b - a);
  const hot = flat[HOT - 1] ?? Infinity, warm = flat[HOT + WARM - 1] ?? Infinity;
  return grid.map(row => row.map(v => v > 0 && v >= hot ? "rgba(255,59,64,.9)" : v > 0 && v >= warm ? "rgba(255,59,64,.28)" : "transparent"));
}
function boxes(vals) {           // last-5 numbers, most recent first
  return `<span class="l5">${(vals || []).slice(0, 5).map(v => v == null ? `<i class="na">–</i>` : `<i class="b${Math.min(v, 4)}">${v}</i>`).join("")}</span>`;
}
function gridPitch(players, grid, opts) {
  const {confirmed, cardOf, statOf, focus} = opts;
  const cells = shadeGrid(grid).map(row => row.map(c => `<i style="background:${c}"></i>`).join("")).join("");
  const cards = players.map(x => {
    const [l, t] = vpos(x), c = cardOf ? cardOf(x) : null, faded = focus && !focus.has(x.pid);
    return `<a class="pc ${x.side === "H" ? "h" : "a"}${faded ? " dim" : ""}" href="?p=${encodeURIComponent(x.name)}" style="left:${(l * 100).toFixed(1)}%;top:${(t * 100).toFixed(1)}%">
      <span class="hd"><span class="dot">${x.shirt ?? ""}</span>${c ? `<span class="odds${c.v ? " v" : ""}">${od(c.best)}</span>` : ""}</span><span class="nm">${esc(last(x.name))}</span>${statOf ? boxes(statOf(x)) : ""}</a>`;
  }).join("");
  return `<div class="vpitch ${confirmed ? "ok" : "pred"}"><div class="grid">${cells}</div><div class="lines"><b class="half"></b><b class="circle"></b><b class="box t"></b><b class="box b"></b></div>${cards}</div>`;
}
function gameView(g, mode = 0) {
  const pl = (g.pitch || []).filter(x => x.pos !== "G" || true), fm = g.foul_map || [];
  const cards = Object.fromEntries((g.cards || []).map(c => [c.pid, c]));
  const [home, away] = g.game.split(" v ");
  const commitSide = mode === 0 ? "H" : "A";
  const commitTeam = mode === 0 ? home : away, winTeam = mode === 0 ? away : home;
  const grid = foulGrid(pl, mode);
  const pitch = gridPitch(pl, grid, {
    confirmed: g.lineup === "standard",
    cardOf: x => { const c = cards[x.pid]; return c && c.best ? {best: c.best, v: c.edge != null && c.edge >= 0.15} : null; },
    statOf: x => (x.rf || []).map(r => r == null ? null : (x.side === commitSide ? r[0] : r[1])),
  });
  const magnets = fm.filter(m => m.side !== commitSide).slice(0, 3).map(m => `<li><a href="?p=${encodeURIComponent(m.name)}">${esc(m.name)}</a> wins <b>${m.fw.toFixed(1)}</b> fouls a game
      ${m.near.length ? `<small>Around them: ${m.near.slice(0, 2).map(n => { const c = Object.values(cards).find(c => c.player === n.name);
        return `<a href="?p=${encodeURIComponent(n.name)}">${esc(n.name)}</a>${c && c.best ? ` <span class="np${c.edge >= 0.15 ? " v" : ""}">${od(c.best)}</span>` : ""}`; }).join(", ")}</small>` : ""}</li>`).join("");
  out.innerHTML = `<div class="card gv">
    <div class="namerow"><div><div class="name">${esc(g.game)}</div>
    <div class="sub">${new Date(g.kickoff).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})} · ${g.lineup === "standard" ? "lineups confirmed" : "predicted lineups"}</div></div>
    <button class="sharebtn" id="swap" type="button">Swap ⇄</button></div>
    <p class="legend"><span><i class="kh"></i>${esc(commitTeam)}: fouls committed</span><span><i class="ka"></i>${esc(winTeam)}: fouls won</span></p>
    ${pitch}
    <p class="cap">Red = the 3 spots where ${esc(commitTeam)} foul and ${esc(winTeam)} get fouled most. Faint red = the next 5. Boxes under each player: their last 5 games, most recent first. Number next to the shirt = best card price (green = value).</p>
    ${magnets ? `<h3>${esc(winTeam)} players who win the most fouls</h3><ul class="facts">${magnets}</ul>` : ""}
    ${foulPairsBlock(g, commitSide)}
  </div>`;
  document.getElementById("swap").onclick = () => gameView(g, 1 - mode);
  wireFoulPairs(g, commitSide);
  history.replaceState(null, "", "?g=" + g.fotmob_id);
}

// ---------- games list (default view) ----------
function gamesList() {
  // only games with a card market: at least one player with a bookie card price
  const gs = Object.values(GAMES).filter(g => (g.pitch || []).length && (g.cards || []).some(c => c.best))
    .sort((a, b) => a.kickoff.localeCompare(b.kickoff));
  if (!gs.length) { out.innerHTML = '<p class="none">No games with card markets and lineups yet.</p>'; return; }
  let html = "", day = "";
  for (const g of gs) {
    const d = new Date(g.kickoff).toLocaleDateString([], {weekday: "long", day: "numeric", month: "short"});
    if (d !== day) { html += `${day ? "</div>" : ""}<h2>${d}</h2><div class="glist">`; day = d; }
    const nv = (g.cards || []).filter(c => c.value && c.best).length;
    const lg = String(g.league).replace(/ Grp\. \w+/, "").replace(" (INT)", "");
    html += `<a class="grow" href="?g=${g.fotmob_id}">
      <span class="gt">${new Date(g.kickoff).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})}</span>
      <span class="gn"><b>${esc(g.game)}</b><small>${esc(lg)}${g.lineup === "standard" ? " · lineups out" : ""}</small></span>
      <span class="gv2">${nv ? `<em>${nv} value</em>` : ""}<i>›</i></span></a>`;
  }
  out.innerHTML = html + "</div>";
}
// ---------- player page matchup: same grid pitch, only the player and their direct opponent ----------
function matchupGrid(p) {
  const pl = p.pitch || []; const me = pl.find(x => x.pid === p.pid); if (!me) return "";
  const opp = pl.find(x => x.side !== me.side && x.name === p.opp);
  const G = Array.from({length: 12}, () => Array(8).fill(0));
  if (me.heat && opp && opp.heat) {
    const A = Array.from({length: 12}, () => Array(8).fill(0)), B = Array.from({length: 12}, () => Array(8).fill(0));
    for (let i = 0; i < 12; i++) for (let j = 0; j < 8; j++) { let [r, c] = cellOf(me, i, j); A[r][c] = me.heat[i][j]; [r, c] = cellOf(opp, i, j); B[r][c] = opp.heat[i][j]; }
    let mx = 0; for (let r = 0; r < 12; r++) for (let c = 0; c < 8; c++) { G[r][c] = Math.sqrt(A[r][c] * B[r][c]); mx = Math.max(mx, G[r][c]); }
    for (let r = 0; r < 12; r++) for (let c = 0; c < 8; c++) G[r][c] /= mx || 1;
  }
  const pitch = gridPitch(pl, G, {confirmed: !p.predicted, focus: new Set([me.pid, opp && opp.pid]),
    statOf: x => (x.rf || []).map(r => r == null ? null : (x.pid === me.pid ? r[0] : r[1]))});
  const ov = p.opp_overlap != null ? Math.round(p.opp_overlap * 100) : null, fw = p.opp_fouls_won_raw90 ?? p.opp_fouls_won90;
  const facts = opp ? [fw != null ? `${last(p.opp)} wins <b>${(+fw).toFixed(1)}</b> fouls a game` : null,
    p.fouls90 ? `${last(p.player)} commits <b>${(+p.fouls90).toFixed(1)}</b> fouls a game` : null,
    ov != null && !me.est && !opp.est ? `They share <b>${ov}%</b> of the same space` : null].filter(Boolean) : [];
  const est = [me.est && last(p.player), opp && opp.est && last(p.opp)].filter(Boolean);
  return `<h3>Matchup: ${esc(p.player)} v ${esc(p.opp || "no direct opponent")}</h3>${pitch}
    <p class="cap">Red = the 3 spots where they meet most. Faint red = the next 5. Boxes: ${esc(last(p.player))}'s fouls committed and ${esc(last(p.opp || ""))}'s fouls won, last 5 games, most recent first.</p>
    ${facts.length ? `<ul class="facts">${facts.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
    ${est.length ? `<p class="cap">No tracking data for ${est.join(" or ")}: position estimated.</p>` : ""}
    <p class="cap"><a href="?g=${p.gid}">See the whole game's foul heatmap</a></p>`;
}

// ---------- price over time (player page) ----------
function priceChart(p) {
  const h = (p.hist || []).filter(r => r[1]); if (h.length < 2) return "";
  const W = 420, H = 210, L = 34, R = 8, T = 12, B = 24;
  const ts = h.map(r => +new Date(r[0])), end = Math.max(ts[ts.length - 1], Math.min(+new Date(p.ko), Date.now()));
  const t0 = ts[0], t1 = Math.max(end, t0 + 3600e3);
  const vals = h.flatMap(r => [r[1], r[3], r[3] * 1.15]);
  let lo = Math.min(...vals) * 0.92, hi = Math.max(...vals) * 1.06;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let step = "", fairL = "", zone = "";
  h.forEach((r, i) => { const X = x(ts[i]), Xn = i + 1 < h.length ? x(ts[i + 1]) : x(t1);
    step += `${i ? "L" : "M"}${X.toFixed(1)} ${y(r[1]).toFixed(1)} L${Xn.toFixed(1)} ${y(r[1]).toFixed(1)} `;
    fairL += `${i ? "L" : "M"}${X.toFixed(1)} ${y(r[3]).toFixed(1)} L${Xn.toFixed(1)} ${y(r[3]).toFixed(1)} `;
    zone += `<rect x="${X.toFixed(1)}" y="${T}" width="${Math.max(0, Xn - X).toFixed(1)}" height="${Math.max(0, y(r[3] * 1.15) - T).toFixed(1)}" fill="var(--accent)" opacity=".10"/>`; });
  const dots = h.map((r, i) => `<circle cx="${x(ts[i]).toFixed(1)}" cy="${y(r[1]).toFixed(1)}" r="3" fill="var(--fg)"><title>${new Date(ts[i]).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})}: ${od(r[1])} ${esc(r[2])} (fair ${r[3]})</title></circle>`).join("");
  let grid = ""; const n = 4; for (let k = 0; k <= n; k++) { const v = lo + (hi - lo) * k / n;
    grid += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(1)}</text>`; }
  const fmt = t => new Date(t).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});
  const first = h[0], lastp = h[h.length - 1];
  return `<h3>Price over time</h3><div class="pchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Best price and fair price over time">${grid}${zone}
    <path d="${fairL}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><path d="${step}" fill="none" stroke="var(--fg)" stroke-width="2"/>${dots}
    <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmt(t0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(t1)}</text></svg></div>
    <p class="cap">Solid line: best price at our books (${od(first[1])} → ${od(lastp[1])}). Dashed: our fair price. Green band: value zone (15%+ over fair).</p>`;
}

// ---------- double / bet builder checker ----------
// backtest/team_style_and_pairs.py: beyond chance, two bookings in the same game come together x1.01 (same team),
// x1.06 (opposite teams), x1.075 (direct opponents). Different games: independent.
function pairLift(a, b) {
  if (a.gid !== b.gid) return 1;
  if (a.team === b.team) return 1.01;
  const direct = [a.opp, a.model_opp].includes(b.player) || [b.opp, b.model_opp].includes(a.player);
  return direct ? 1.075 : 1.06;
}
function doubleBox(p) {
  if (!p.fair) return "";
  const others = players.filter(q => q !== p && q.fair && !q.bench).sort((a, b) => (b.gid === p.gid) - (a.gid === p.gid) || a.fair - b.fair);
  if (!others.length) return "";
  const opts = others.slice(0, 200).map(q => `<option value="${players.indexOf(q)}">${esc(q.player)} · ${esc(q.gid === p.gid ? "same game" : q.game)} · fair ${q.fair}</option>`).join("");
  return `<details class="more"><summary>Double / bet builder checker</summary>
    <label class="cap" for="dbl2">Add a second player</label><select id="dbl2" class="dsel">${opts}</select>
    <label class="cap" for="dblp">Bookie's price for the double (decimal)</label><input id="dblp" class="dsel" inputmode="decimal" placeholder="e.g. 18.66">
    <div id="dblout" class="dout"></div></details>`;
}
function wireDouble(p) {
  const s = document.getElementById("dbl2"), i = document.getElementById("dblp"), o = document.getElementById("dblout");
  if (!s) return;
  const calc = () => {
    const q = players[+s.value]; if (!q) return;
    const lift = pairLift(p, q), fair = p.fair * q.fair / lift, need = fair * 1.15, price = parseFloat(i.value);
    const edge = price ? price / fair - 1 : null;
    o.innerHTML = `<div class="nums"><div><b>${fair.toFixed(2)}</b><span>fair double</span></div><div><b>${need.toFixed(2)}+</b><span>value from</span></div>
      <div><b class="${edge == null ? "" : edge >= 0.15 ? "pos" : edge < 0 ? "neg" : ""}">${edge == null ? "–" : (edge > 0 ? "+" : "") + Math.round(edge * 100) + "%"}</b><span>${edge == null ? "enter a price" : "v fair"}</span></div></div>
      <p class="cap">${p.fair} × ${q.fair}${lift !== 1 ? ` ÷ ${lift} (same-game link: ${lift === 1.01 ? "same team" : lift === 1.075 ? "direct opponents" : "opposite teams"})` : " (different games, independent)"}. ${edge != null && edge < 0.15 ? "Not value as a double." : ""}</p>`;
  };
  s.onchange = calc; i.oninput = calc; calc();
}

// ---------- foul matchups: A commits + B (direct opponent) is fouled; one foul can land both legs ----------
const COMBO_NAMES = {"11": "1+ & 1+", "21": "2+ & 1+", "12": "1+ & 2+", "22": "2+ & 2+"};
function foulPairsBlock(g, commitSide) {
  const team = commitSide === "H" ? 0 : 1;
  const fp = (g.foul_pairs || []).filter(x => x.a_team === team).slice(0, 8);
  if (!fp.length) return "";
  const rows = fp.map((x, i) => {
    const cells = Object.keys(COMBO_NAMES).map(k => { const c = x.combos[k];
      const v = c.edge != null && c.edge >= 0.25;
      return `<div class="fc${v ? " v" : ""}"><span>${COMBO_NAMES[k]}</span><b>${c.fair ?? "–"}</b>${c.price ? `<small>${c.price} multiplied${c.edge != null ? ` · ${c.edge > 0 ? "+" : ""}${Math.round(c.edge * 100)}%` : ""}</small>` : ""}</div>`; }).join("");
    const la = x.la && x.la["1"] ? ` · fouls 1+ ${od(x.la["1"])}${x.la["2"] ? `, 2+ ${od(x.la["2"])}` : ""}` : "";
    return `<li><div class="fph"><b>${esc(x.a)}</b> commits <small style="display:inline">${x.a_f90} a game${la}</small><br>→ <b>${esc(x.b)}</b> is fouled <small style="display:inline">${x.b_fw90} a game</small></div>
      <div class="fgrid">${cells}</div>
      <div class="fchk"><select data-i="${i}">${Object.keys(COMBO_NAMES).map(k => `<option value="${k}">${COMBO_NAMES[k]}</option>`).join("")}</select>
      <input data-i="${i}" inputmode="decimal" placeholder="builder price"><span class="fres"></span></div></li>`;
  }).join("");
  return `<h3>Foul matchups</h3><p class="cap">Builder of "commits a foul" + their direct opponent "is fouled". Bookies price the two legs as if they were unrelated, but one foul can land both, so the fair price (big number) is shorter than the legs multiplied. Type the bookie's builder price to check it. Best spot in testing: 2+ & 2+ at 25%+ over fair.</p><ul class="fpairs">${rows}</ul>`;
}
function wireFoulPairs(g, commitSide) {
  const team = commitSide === "H" ? 0 : 1, fp = (g.foul_pairs || []).filter(x => x.a_team === team).slice(0, 8);
  out.querySelectorAll(".fchk").forEach(box => {
    const sel = box.querySelector("select"), inp = box.querySelector("input"), res = box.querySelector(".fres");
    const calc = () => { const x = fp[+sel.dataset.i], c = x.combos[sel.value], pr = parseFloat(inp.value);
      if (!pr || !c.p) { res.textContent = ""; return; }
      const e = pr * c.p - 1; res.innerHTML = `<b class="${e >= 0.25 ? "pos" : e < 0 ? "neg" : ""}">${e > 0 ? "+" : ""}${Math.round(e * 100)}%</b> v fair ${c.fair}`; };
    sel.onchange = calc; inp.oninput = calc;
  });
}
function statsTable(p) {
  const a = p.stats90 || {}, b = p.opp_stats90 || {};
  const KEEP = ["Fouls", "Fouls won", "Tackles", "Duels won", "Dribbled past"];
  const keys = KEEP.filter(k => k in a || k in b); if (!keys.length) return "";
  const rows = keys.map(k => `<tr><td>${esc(k)}</td><td>${a[k] ?? "–"}</td><td>${b[k] ?? "–"}</td></tr>`).join("");
  return `<h3>Per 90 this season</h3><table class="st"><tr><th></th><th>${esc(p.player.split(" ").slice(-1)[0])}</th><th>${esc((p.opp || "Opponent").split(" ").slice(-1)[0])}</th></tr>${rows}</table>`;
}
function recordBlock(p) {
  const r = p.ref || {}, bits = [];
  if (p.season_apps != null) bits.push(`<b>${p.season_yc ?? 0}</b> yellow${p.season_yc === 1 ? "" : "s"}${p.season_rc ? `, <b>${p.season_rc}</b> red` : ""} in ${p.season_apps} league games this season${p.season_league ? " (" + esc(p.season_league) + ")" : ""}`);
  if (p.recent_n) bits.push(`Booked in <b>${p.booked_recent}</b> of the last ${p.recent_n} games`);
  if (p.mins) bits.push(`${(p.cards / p.mins * 90).toFixed(2)} cards per 90 over ${p.mins} recent minutes`);
  if (p.role && p.role_record) bits.push(`Today as ${esc(p.role)}: booked in ${p.role_record[1]} of ${p.role_record[0]} starts there${p.out_of_position ? " <b>(out of position, usually " + esc(p.usual_role) + ")</b>" : ""}`);
  const ref = r.name ? `<b>${esc(r.name)}</b>: ${r.ypg != null ? r.ypg.toFixed(1) : "–"} yellows a game (league ${r.league_avg != null ? r.league_avg.toFixed(1) : "–"}), ${r.cards_pg != null ? r.cards_pg.toFixed(1) : "–"} cards a game over ${r.games ?? "?"} games` : "Not announced";
  return `<h3>Card record</h3><p class="rec">${bits.join("<br>")}</p><h3>Referee</h3><p class="rec">${ref}</p>`;
}
function tcardsBlock(p) {
  const t = p.tcards; if (!t) return "";
  const heat = t.heat || 1, mood = heat >= 1.08 ? "hotter than" : heat <= 0.92 ? "cooler than" : "in line with";
  return `<h3>Total cards in the game</h3><p class="rec">Line <b>${t.line}</b>: Over ${t.over} / Under ${t.under} (median of ${t.n_books} books).<br>
    Market expects <b>${t.market_exp.toFixed(1)}</b> cards, ${mood} our player model (${t.model_exp.toFixed(1)}).${(t.standouts || []).length ? "<br>Stands out: " + esc(t.standouts.join(", ")) : ""}</p>`;
}
function benchView(p) {
  const s = p.sub || [0, 0, 0], st = p.starts_record || [0, 0];
  const shown = Object.entries(p.shown || {}).map(([b, o]) => `${esc(b)} ${od(o)}`).join(" · ");
  out.innerHTML = `<div class="card"><div class="name">${esc(p.player)}</div>
    <div class="sub">${esc(p.team)} · ${esc(p.game)} · on the bench</div>
    <div class="verdict fair">On the bench</div>
    <div>Most books void the bet if the player doesn't come on. Subs usually get 20–30 minutes, often when the game is at its most heated.</div>
    <div class="nums"><div><b>${p.best}</b><span>best · ${esc(p.book)}</span></div>
      <div><b>${s[0] ? s[2] + "/" + s[0] : "–"}</b><span>booked in sub apps</span></div>
      <div><b>${s[1] ? (s[2] / s[1] * 90).toFixed(2) : "–"}</b><span>cards per 90 off the bench</span></div></div>
    <div class="books">${shown}</div>
    <h3>Card record</h3><p class="rec">Off the bench: ${s[2]} booking${s[2] === 1 ? "" : "s"} in ${s[0]} appearances (${s[1]} minutes)<br>As a starter: booked in ${st[1]} of ${st[0]} starts${p.usual_role ? " (usually " + esc(p.usual_role) + ")" : ""}</p>
    ${tcardsBlock(p)}</div>`;
  history.replaceState(null, "", (EXAMPLE ? "?example&p=" : "?p=") + encodeURIComponent(p.player));
}
function show(p) {
  if (p.bench) return benchView(p);
  const v = p.verdict || {};
  const chance = p.fair ? (100 / p.fair).toFixed(0) + "%" : "–";
  const shown = Object.entries(p.shown || {}).map(([b, o]) => `${esc(b)} ${od(o)}`).join(" · ");
  const facRow = ([s, t]) => `<div class="f ${s > 0 ? "p" : s < 0 ? "n" : "z"}"><i>${s > 0 ? "✓" : s < 0 ? "✗" : "•"}</i><span>${esc(t)}</span></div>`;
  const ranked = [...(p.factors || [])].sort((a, b) => Math.abs(b[0]) - Math.abs(a[0]));
  const ko = new Date(p.ko).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"});
  const src = [p.data_src && p.data_src.length ? `${last(p.player)}'s stats include ${esc(p.data_src.join(", "))}` : "",
               p.opp_data_src && p.opp_data_src.length ? `${last(p.opp)}'s include ${esc(p.opp_data_src.join(", "))}` : ""].filter(Boolean).join(". ");
  out.innerHTML = `<div class="card">
    <div class="namerow"><div class="name">${esc(p.player)}</div><button class="sharebtn" id="sharebtn" type="button">Share</button></div>
    <div class="sub">${esc(p.team)} · <a href="?g=${p.gid}">${esc(p.game)}</a> · ${ko}</div>
    ${p.start_chance != null && p.start_chance < 0.95 ? `<div class="sub">Start chance <b>${Math.round(p.start_chance * 100)}%</b>${p.avail_note ? " · " + esc(p.avail_note) : ""}</div>` : ""}
    ${p.fair_only ? `<p class="predicted">Not in our odds feed. Compare the fair price with the bookies yourself.</p>` : p.predicted ? `<p class="predicted">Lineup not confirmed yet, so this isn't sent as a pick.</p>` : ""}
    <div class="verdict ${esc(v.tag)}">${esc(v.label || "")}</div>
    <p class="vtext">${esc(v.text || "")}</p>
    <div class="nums">
      <div><b>${od(p.best)}</b><span>${esc(p.book || "no price")}${p.super_sub ? " · " + esc(p.sub_cover || "Super Sub") : ""}</span></div>
      <div><b>${p.fair ?? "–"}</b><span>fair (${chance})</span></div>
      <div><b>${p.confidence ? p.confidence + "/10" : "–"}</b><span>confidence</span></div>
    </div>
    ${p.why ? `<h3>Why they could get booked</h3><p class="whyline">${esc(p.why)}</p>` : ""}
    ${priceChart(p)}
    ${matchupGrid(p)}
    ${doubleBox(p)}
    <details class="more full"><summary>More detail</summary>
    ${ranked.length ? "<h3>For and against</h3>" + ranked.map(facRow).join("") : ""}
    ${statsTable(p)}
    ${recordBlock(p)}
    ${tcardsBlock(p)}
    <div class="books">${shown}</div>
    ${src ? `<p class="cap">${src}.</p>` : ""}
    <p class="cap">A pick needs one bookie 15%+ over fair and confidence 6/10+. We skip markets only 1–2 bookies price, and prices 20%+ above every other bookie (or bet365 alone at the top): in testing those lost about 20%, usually because the bookie knew something. They still show here as "Big price, but be careful".</p>
    </details>
  </div>`;
  document.getElementById("sharebtn").onclick = () => shareCard(p);
  wireDouble(p);
  history.replaceState(null, "", (EXAMPLE ? "?example&p=" : "?p=") + encodeURIComponent(p.player));
}
</script>
</body></html>
