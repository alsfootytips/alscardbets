<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Check · Al's Card Bets</title><link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel=stylesheet><link rel=stylesheet href="brand.css"><link rel=icon href="logo.jpg"><style>main{max-width:680px}</style></head><body>
<header class=top><div class=in><a class=logo href="picks.html"><img src="logo.jpg" alt="Al's Card Bets"></a><nav><a href="picks.html">Picks</a><a class=on href="check.html">Player check</a><a href="combos.html">Combos</a><a href="referees.html">Referees</a><a href="index.html">Results</a></nav></div></header><main>
<h1>Player check</h1>
<p class="meta">Any player with a card price in the next few days. <a href="check.html?example">Example</a></p>
<input id="q" placeholder="Search a player" autocomplete="off" autofocus>
<ul id="list"></ul>
<div id="out"></div>
<footer class=foot><i></i>Al's Card Bets</footer></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ø/g,"o").toLowerCase();
let players = [], updated = "";
const EXAMPLE = new URLSearchParams(location.search).has("example");
if (EXAMPLE) document.querySelector(".meta").outerHTML = '<p class="meta example">Example analysis from a past game: <b>Bournemouth v Sunderland, Sun 18 Oct 2026</b>, priced 10 minutes before kickoff. Search any player in that game. <a href="check.html">Back to live players</a></p>';
fetch((EXAMPLE ? "example.json?" : "picks_latest.json?") + Date.now()).then(r => r.json()).then(d => {
  for (const g of Object.values(d)) {
    if (g.status !== "ok") continue;
    if (g.priced_at > updated) updated = g.priced_at;
    for (const c of g.cards || []) if (c.best || (g.fair_only && c.fair)) players.push({...c, fair_only: !!g.fair_only, game: g.game, league: g.league, ko: g.kickoff, ref: g.referee || {}, pitch: g.pitch || [], predicted: g.lineup !== "standard", lineup: g.lineup});
    for (const b of g.bench || []) if (b.best) players.push({...b, bench: true, game: g.game, league: g.league, ko: g.kickoff, ref: g.referee || {}, pitch: [], tcards: g.tcards, predicted: g.lineup !== "standard"});
    for (const p of players) if (p.game === g.game) p.tcards = g.tcards;
  }
  document.querySelector(".meta").insertAdjacentHTML("beforeend", ` · ${players.length} players priced` + (updated ? `, updated ${new Date(updated).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}` : ""));
  const p = new URLSearchParams(location.search).get("p") || (EXAMPLE ? "Granit Xhaka" : "");
  if (p) { q.value = p; search(); }
  if (!players.length && !EXAMPLE) out.innerHTML = '<p class="none">No players priced in the next few days yet. <a href="check.html?example">See an example analysis</a>.</p>';
}).catch(() => { out.innerHTML = '<p class="none">No games priced right now. Check back once lineups are announced.</p>'; });

const q = document.getElementById("q"), list = document.getElementById("list"), out = document.getElementById("out");
function search() {
  const t = norm(q.value.trim());
  out.innerHTML = "";
  if (t.length < 2) { list.innerHTML = ""; return; }
  const hits = players.filter(p => norm(p.player).includes(t) || norm(p.team).includes(t));
  if (hits.length === 1) { list.innerHTML = ""; show(hits[0]); return; }
  list.innerHTML = hits.slice(0, 30).map((p, i) => `<li data-i="${players.indexOf(p)}">${esc(p.player)} <small>${esc(p.team)} · ${esc(p.game)} · ${new Date(p.ko).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})}${p.predicted ? " · predicted lineup" : ""}${p.bench ? " · bench" : ""}</small></li>`).join("")
    || '<li class="none">Not found. Only players with a card price in the next few days are listed.</li>';
}
q.addEventListener("input", search);
list.addEventListener("click", e => { const li = e.target.closest("li[data-i]"); if (li) { list.innerHTML = ""; show(players[+li.dataset.i]); } });


// ---------- pitch: lineups + season heatmaps ----------
const NX = 12, NY = 8, L = 105, W = 68;
function heatRects(grid, flip, colour) {
  if (!grid) return "";
  const mx = Math.max(...grid.flat()) || 1; let s = "";
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
    const v = grid[i][j] / mx; if (v < 0.35) continue;
    const ii = flip ? NX - 1 - i : i, jj = flip ? NY - 1 - j : j;
    s += `<rect x="${(ii * L / NX).toFixed(2)}" y="${(jj * W / NY).toFixed(2)}" width="${(L / NX).toFixed(2)}" height="${(W / NY).toFixed(2)}" fill="${colour}" fill-opacity="${(0.15 + 0.55 * v).toFixed(2)}"/>`;
  }
  return s;
}
function pitchSvg(p) {
  const pl = p.pitch || []; if (!pl.length) return "";
  const me = pl.find(x => x.pid === p.pid); if (!me) return "";
  const flipMe = me.side === "A";                         // draw home attacking right
  const zoneNames = (p.zone_opps || []).map(z => z[0]);
  const zone = pl.filter(x => x.side !== me.side && zoneNames.includes(x.name));
  let heat = heatRects(me.heat, flipMe, "#F2D022");
  const main = zone.find(x => x.name === zoneNames[0]);
  if (main) heat = heatRects(main.heat, main.side === "A", "#e5484d") + heat;   // main opponent underneath, player on top
  const pos = x => {                                       // FotMob layout is each team's own half, x from own goal
    const X = x.side === "H" ? x.x * 52.5 : L - x.x * 52.5, Y = x.side === "H" ? x.y * W : W - x.y * W; return [X, Y];
  };
  const dots = pl.map(x => {
    const [X, Y] = pos(x), isMe = x.pid === p.pid, isZone = zoneNames.includes(x.name);
    const fill = isMe ? "#F2D022" : isZone ? "#e5484d" : (x.side === me.side ? "#ffffff" : "#f2a3a5");
    const r = isMe || isZone ? 2.6 : 1.9;
    const label = (isMe || isZone) ? `<text x="${X.toFixed(1)}" y="${(Y - 3.4).toFixed(1)}" font-size="3" text-anchor="middle" class="pl">${esc(x.name.split(" ").slice(-1)[0])}</text>` : "";
    return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="${r}" fill="${fill}" stroke="#172A3A" stroke-width="0.6"/>${label}`;
  }).join("");
  const lines = `<rect x="0" y="0" width="${L}" height="${W}" fill="none" class="ln"/><line x1="52.5" y1="0" x2="52.5" y2="${W}" class="ln"/>
    <circle cx="52.5" cy="34" r="9.15" fill="none" class="ln"/><rect x="0" y="13.84" width="16.5" height="40.32" fill="none" class="ln"/>
    <rect x="88.5" y="13.84" width="16.5" height="40.32" fill="none" class="ln"/><rect x="0" y="24.84" width="5.5" height="18.32" fill="none" class="ln"/>
    <rect x="99.5" y="24.84" width="5.5" height="18.32" fill="none" class="ln"/>`;
  const zl = (p.zone_opps || []).map(z => `${esc(z[0])} (${Math.round(z[1] * 100)}%)`).join(", ");
  return `<h3>Who they'll be up against</h3>
    <svg viewBox="-2 -2 ${L + 4} ${W + 4}" class="pitch" role="img" aria-label="Lineups and heatmaps">${lines}${heat}${dots}</svg>
    <p class="sub"><span style="color:#F2D022;text-shadow:0 0 1px #172A3A">■</span> ${esc(p.player)} &nbsp; <span style="color:#e5484d">■</span> ${esc(zoneNames[0] || "opponent")}, who shares most of the same space. Red dots: the opponents ${esc(p.player.split(" ").slice(-1)[0])} will be around most${zl ? " (" + zl + ")" : ""}.
    The % is how much their season heatmaps overlap.${me.side === "A" ? " (Pitch flipped so " + esc(p.team) + " attack left to right.)" : ""}</p>`;
}
function statsTable(p) {
  const a = p.stats90 || {}, b = p.opp_stats90 || {};
  const keys = Object.keys(a).length ? Object.keys(a) : Object.keys(b); if (!keys.length) return "";
  const rows = keys.map(k => `<tr><td>${esc(k)}</td><td>${a[k] ?? "–"}</td><td>${b[k] ?? "–"}</td></tr>`).join("");
  return `<h3>Per 90 this season</h3><table class="st"><tr><th></th><th>${esc(p.player.split(" ").slice(-1)[0])}</th><th>${esc((p.opp || "Opponent").split(" ").slice(-1)[0])}</th></tr>${rows}</table>`;
}
function recordBlock(p) {
  const r = p.ref || {}, bits = [];
  if (p.season_apps != null) bits.push(`<b>${p.season_yc ?? 0}</b> yellow${p.season_yc === 1 ? "" : "s"}${p.season_rc ? `, <b>${p.season_rc}</b> red` : ""} in ${p.season_apps} league games this season${p.season_league ? " (" + esc(p.season_league) + ")" : ""}`);
  if (p.recent_n) bits.push(`Booked in <b>${p.booked_recent}</b> of the last ${p.recent_n} games`);
  if (p.mins) bits.push(`${(p.cards / p.mins * 90).toFixed(2)} cards per 90 over ${p.mins} recent minutes`);
  if (p.role && p.role_record) bits.push(`Today as ${esc(p.role)}: booked in ${p.role_record[1]} of ${p.role_record[0]} starts there${p.out_of_position ? " <b>(out of position, usually " + esc(p.usual_role) + ")</b>" : ""}`);
  const ref = r.name ? `<b>${esc(r.name)}</b>: ${r.ypg != null ? r.ypg.toFixed(1) : "–"} yellows a game (league ${r.league_avg != null ? r.league_avg.toFixed(1) : "–"}), ${r.cards_pg != null ? r.cards_pg.toFixed(1) : "–"} cards a game over ${r.games ?? "?"} games` : "Not announced";
  return `<h3>Card record</h3><p class="rec">${bits.join("<br>")}</p><h3>Referee</h3><p class="rec">${ref}</p>`;
}
function tcardsBlock(p) {
  const t = p.tcards; if (!t) return "";
  const heat = t.heat || 1, mood = heat >= 1.08 ? "hotter than" : heat <= 0.92 ? "cooler than" : "in line with";
  return `<h3>Total cards in the game</h3><p class="rec">Line <b>${t.line}</b>: Over ${t.over} / Under ${t.under} (median of ${t.n_books} books).<br>
    Market expects <b>${t.market_exp.toFixed(1)}</b> cards, ${mood} our player model (${t.model_exp.toFixed(1)}).${(t.standouts || []).length ? "<br>Stands out: " + esc(t.standouts.join(", ")) : ""}</p>`;
}
function benchView(p) {
  const s = p.sub || [0, 0, 0], st = p.starts_record || [0, 0];
  const shown = Object.entries(p.shown || {}).map(([b, o]) => `${esc(b)} ${o ?? "–"}`).join(" · ");
  out.innerHTML = `<div class="card"><div class="name">${esc(p.player)}</div>
    <div class="sub">${esc(p.team)} · ${esc(p.game)} · on the bench</div>
    <div class="verdict fair">On the bench</div>
    <div>Most books void the bet if the player doesn't come on. Subs usually get 20–30 minutes, often when the game is at its most heated.</div>
    <div class="nums"><div><b>${p.best}</b><span>best · ${esc(p.book)}</span></div>
      <div><b>${s[0] ? s[2] + "/" + s[0] : "–"}</b><span>booked in sub apps</span></div>
      <div><b>${s[1] ? (s[2] / s[1] * 90).toFixed(2) : "–"}</b><span>cards per 90 off the bench</span></div></div>
    <div class="books">${shown}</div>
    <h3>Card record</h3><p class="rec">Off the bench: ${s[2]} booking${s[2] === 1 ? "" : "s"} in ${s[0]} appearances (${s[1]} minutes)<br>As a starter: booked in ${st[1]} of ${st[0]} starts${p.usual_role ? " (usually " + esc(p.usual_role) + ")" : ""}</p>
    ${tcardsBlock(p)}</div>`;
  history.replaceState(null, "", (EXAMPLE ? "?example&p=" : "?p=") + encodeURIComponent(p.player));
}
function show(p) {
  if (p.bench) return benchView(p);
  const v = p.verdict || {};
  const chance = p.fair ? (100 / p.fair).toFixed(0) + "%" : "–";
  const shown = Object.entries(p.shown || {}).map(([b, o]) => `${esc(b)} ${o ?? "–"}`).join(" · ");
  const facRow = ([s, t]) => `<div class="f ${s > 0 ? "p" : s < 0 ? "n" : "z"}"><i>${s > 0 ? "✓" : s < 0 ? "✗" : "•"}</i><span>${esc(t)}</span></div>`;
  const ranked = [...(p.factors || [])].sort((a, b) => Math.abs(b[0]) - Math.abs(a[0]));
  const fac = ranked.slice(0, 3).map(facRow).join("");
  const facRest = ranked.slice(3).map(facRow).join("");
  const angleTxt = {strong: "Strong matchup", good: "Good matchup", neutral: "Average matchup", weak: "Poor matchup"}[v.angle] || "";
  out.innerHTML = `<div class="card">
    <div class="name">${esc(p.player)}</div>
    <div class="sub">${esc(p.team)} · ${esc(p.game)} · KO ${new Date(p.ko).toLocaleString([], {weekday: "short", hour: "2-digit", minute: "2-digit"})}</div>
    ${p.fair_only ? `<p class="predicted">Not in our odds feed yet. Compare the fair price with bet365 yourself.</p>` : ""}${p.predicted ? `<p class="predicted">${p.lineup === "lastXI" ? "Lineup is each team's last XI (no predicted lineup published yet)" : "Predicted lineup"}. Early price, not sent as a pick. Updated when the teams are announced.</p>` : ""}<div class="verdict ${esc(v.tag)}">${esc(v.label || "")}</div>
    <div>${esc(v.text || "")}</div>
    <div class="nums">
      <div><b>${p.best ?? "–"}</b><span>${esc(p.book || "no price")}</span></div>
      <div><b>${p.fair ?? "–"}</b><span>fair price (${chance})</span></div>
      <div><b>${p.confidence ? p.confidence + "/10" : "–"}</b><span>confidence</span></div>
    </div>
    <div class="books">${p.super_sub ? "<b>Super Sub</b> · " : ""}Value at ${v.need ?? "–"} or bigger</div>
    <h3>Key points</h3>${fac}
    <details class="more full"><summary>Full analysis</summary>
    <span class="angle">${angleTxt}</span>
    ${facRest ? "<h3>More for and against</h3>" + facRest : ""}
    ${pitchSvg(p)}
    ${statsTable(p)}
    ${recordBlock(p)}
    ${tcardsBlock(p)}
    <p class="sub" style="margin-top:14px">Fair price uses the player's card rate, minutes, the referee, the direct opponent and the match odds. A pick needs a price 15% over fair at 3+ bookies, not a one-off outlier and not bet365 alone at the top, plus confidence 6/10 or better (8–10 has been the strongest). Super Sub means the Sky Bet or Paddy Power price, with the replacement counted.</p>
    </details>
  </div>`;
  history.replaceState(null, "", (EXAMPLE ? "?example&p=" : "?p=") + encodeURIComponent(p.player));
}
</script>
</body></html>
