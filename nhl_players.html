<h1>Players</h1><p class=meta>Updated 11:13</p><input id=q type=search placeholder='Search any player' autocomplete=off aria-label='Search any player' style='width:100%;font:500 15px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);margin:10px 0 4px'><div id=qres></div><script src='search.js?v=1'></script><script>const TF={"ANA": "Anaheim Ducks", "BOS": "Boston Bruins", "BUF": "Buffalo Sabres", "CGY": "Calgary Flames", "CAR": "Carolina Hurricanes", "CHI": "Chicago Blackhawks", "COL": "Colorado Avalanche", "CBJ": "Columbus Blue Jackets", "DAL": "Dallas Stars", "DET": "Detroit Red Wings", "EDM": "Edmonton Oilers", "FLA": "Florida Panthers", "LA": "Los Angeles Kings", "MIN": "Minnesota Wild", "MTL": "Montreal Canadiens", "NSH": "Nashville Predators", "NJ": "New Jersey Devils", "NYI": "New York Islanders", "NYR": "New York Rangers", "OTT": "Ottawa Senators", "PHI": "Philadelphia Flyers", "PIT": "Pittsburgh Penguins", "SJ": "San Jose Sharks", "SEA": "Seattle Kraken", "STL": "St. Louis Blues", "TB": "Tampa Bay Lightning", "TOR": "Toronto Maple Leafs", "UTA": "Utah Mammoth", "VAN": "Vancouver Canucks", "VGK": "Vegas Golden Knights", "WSH": "Washington Capitals", "WPG": "Winnipeg Jets"};const q=document.getElementById('q'),R=document.getElementById('qres');let all=null;const norm=s=>s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase();q.addEventListener('input',async()=>{const v=norm(q.value.trim());if(v.length<2){R.innerHTML='';return}if(!all){try{all=await (await fetch('nhl_all.json?d='+new Date().toISOString().slice(0,13))).json()}catch(e){all={}}}const hits=Object.entries(all).map(([id,p])=>[id,p,window.SR?SR.score(q.value,p.n,[p.t,TF[p.t]||'',...SR.aliases(TF[p.t]||'')]):(norm(p.n).includes(v)?1:0)]).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]||b[1].gp-a[1].gp).slice(0,12).map(x=>[x[0],x[1]]);R.innerHTML=hits.length?`<div class=game><div class=rows>${hits.map(([id,p])=>{const L=p.log,a=c=>(L.r
