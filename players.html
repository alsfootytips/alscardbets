<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta http-equiv=refresh content=300><title>Players · Al's Card Bets</title><link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel=stylesheet><link rel=stylesheet href="brand.css?v=f19140e0"><link rel=icon href="logo.jpg"></head><body>
<header class=top><div class=in><a class=logo href="football.html"><img src="logo.jpg" alt="Al's Card Bets"></a><div class=sport role=group aria-label=Sport><a class=on aria-current=page href="football.html">Football</a><a href="nba.html">NBA</a><a href="nhl.html">NHL</a><a href="nfl.html">NFL</a><a href="darts.html">Darts</a><a href="cricket.html">Cricket</a></div><nav><a href="football.html">Fixtures</a><a href="props.html">Props</a><a href="picks.html">Cards</a><a class=on href="players.html">Players</a><a href="index.html">Results</a></nav></div></header><main class=wide>
<h1>Players</h1><input id=q class=posf type=search placeholder='Search player or team' autocomplete=off style='width:100%;max-width:420px'><div id=list></div><script src='search.js?v=1'></script><script>const IMG='https://images.fotmob.com/image_resources/';fetch('players_index.json').then(r=>r.json()).then(all=>{const L=document.getElementById('list'),Q=document.getElementById('q');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sc(q,p){const tm=[p[2],...String(p[5]||'').split(' v ')].filter(Boolean);return SR.score(q,p[1],[...tm,...tm.flatMap(t=>SR.aliases(t))])}
function draw(){const q=Q.value.trim();const g={};
const hits=q?all.map(p=>[sc(q,p),p]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]):all;
for(const p of hits)(g[p[5]||'Other players']??=[]).push(p);
L.innerHTML=Object.entries(g).map(([k,ps],i)=>`<details class='game gfold'${q||i<1?' open':''}><summary><header><h3>${esc(k)}<span class=gcount>${ps.length}</span></h3>${ps[0][4]?`<span>${new Date(ps[0][4]).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'})}</span>`:''}</header></summary><div class=plist>${ps.map(p=>`<a href='player.html?p=${p[0]}'><img class='nface fm' src='${IMG}playerimages/${p[0]}.png' alt='' loading=lazy onerror="this.style.visibility='hidden'"><span><b>${esc(p[1])}</b><small>${esc(p[2])}</small></span></a>`).join('')}</div></details>`).join('')||'<p class=none>No players found.</p>'}
Q.addEventListener('input',draw);draw()})</script>
<p class=meta style="margin-top:28px">Not betting advice.</p>
<footer class=foot><i></i>Al's Card Bets</footer></main>
<script>
const K="openFb";let o=[];try{o=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
document.querySelectorAll("details[id]").forEach(d=>{if(o.includes(d.id))d.open=true;d.addEventListener("toggle",()=>{
let s=new Set(o);d.open?s.add(d.id):s.delete(d.id);o=[...s];try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}})});
</script></body></html>
